name: Build and deploy site

on:
  push:
    branches: [gh-pages]
  # Lets you re-run a deploy by hand from the Actions tab.
  workflow_dispatch:

# Allow GITHUB_TOKEN to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let an in-flight one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true # runs bundle install and caches the gems

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      # baseurl deliberately comes from _config.yml (empty, because the site is
      # served from the custom domain inomjonramatov.uz). Passing
      # steps.pages.outputs.base_path here would inject "/blog" any time GitHub
      # doesn't report the custom domain, breaking every link and asset.
      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
