lessons:
  - id: what-is-a-prompt
    module: basics
    title: "Что такое промпт на самом деле"
    idea: "Промпт — это постановка задачи, а не поисковый запрос. Представьте очень способного нового коллегу, который ни разу не видел ваш курс, ваш код и вашего преподавателя. Он много знает, но о вашей ситуации — ничего. Всё, о чём вы умолчите, ему придётся додумывать."
    weak: "Объясни рекурсию."
    better: |-
      Я студент первого курса, знаю циклы и функции в Python, но с рекурсией ещё не сталкивался.
      Объясни рекурсию простыми словами, потом покажи один короткий пример на Python (факториал) и разбери, что происходит при каждом вызове.
      В конце дай два небольших упражнения, которые я могу решить сам.
    why: "Во втором промпте сказано, кто спрашивает, что он уже знает и как выглядит хороший ответ. Додумывать нечего."
    check:
      q: "Вы получили расплывчатый, шаблонный ответ. В чём, скорее всего, причина?"
      options:
        - "В промпте не описана ситуация, и модели пришлось додумывать."
        - "Модель недостаточно умна для этой темы."
      answer: 0
      explain: "Шаблонные ответы почти всегда появляются из-за нехватки контекста."
    keep: |-
      Я [кто вы и что уже знаете].
      Мне нужно [что вы хотите получить], чтобы [что вы будете с этим делать].
      Хороший ответ — это [формат, объём, уровень].

  - id: be-specific
    module: basics
    title: "Пишите ясно и конкретно"
    idea: "Скажите точно, что вам нужно: цель, аудитория, объём и формат. Полезная проверка — показать промпт другу, который ничего не знает о задаче. Если ему пришлось бы задавать вопросы, они возникнут и у модели."
    weak: "Напиши про изменение климата."
    better: |-
      Напиши введение на 300 слов к школьному эссе о том, как изменение климата влияет на водоснабжение в Центральной Азии.
      Читатель: мой учитель географии. Тон: официальный, но простой.
      Приведи два конкретных факта, которые мне потом нужно будет проверить, и пометь их [ПРОВЕРИТЬ].
    why: "Тема, объём, аудитория и тон заданы, поэтому ответ подходит с первого раза, а не с пятого."
    check:
      q: "Какое дополнение поможет больше всего?"
      options:
        - "«Сделай хорошо и интересно»."
        - "«300 слов, для моего учителя, официальный тон, одним абзацем»."
      answer: 1
      explain: "«Хорошо» ничего не говорит модели. Объём, читатель и формат — говорят."
    keep: |-
      Задача: [что нужно сделать]
      Аудитория: [кто будет читать]
      Объём: [слова / абзацы / пункты]
      Формат: [абзац, список, таблица, код]
      Тон: [официальный, дружелюбный, простой]

  - id: explain-why
    module: basics
    title: "Объясняйте, зачем нужно правило"
    idea: "Голое правило модель выполняет буквально. Правило с объяснением она понимает и разумно применяет к случаям, о которых вы не упомянули."
    weak: "Не используй сложные слова."
    better: "Мои читатели — двенадцатилетние дети, которые учат английский как второй язык, поэтому пиши короткими предложениями и повседневными словами, а каждый специальный термин объясняй при первом появлении."
    why: "Зная, кто читатели, модель правильно принимает множество мелких решений, а не только то одно, которое вы назвали."
    check:
      q: "Зачем добавлять к инструкции причину?"
      options:
        - "Так промпт выглядит вежливее."
        - "Зная причину, модель справится и с ситуациями, которые вы не перечислили."
      answer: 1
      explain: "Причина несёт гораздо больше информации, чем правило само по себе."
    keep: |-
      [Инструкция], потому что [причина: кто будет читать, где это будет использоваться, что пойдёт не так в противном случае].

  - id: show-examples
    module: basics
    title: "Показывайте примеры"
    idea: "Один-два примера задают формат и тон лучше, чем длинное описание. Если можете, дайте от трёх до пяти, сделайте их непохожими друг на друга и чётко отделите от инструкций."
    weak: "Сделай карточки по этим конспектам по биологии."
    better: |-
      Преврати мой конспект по биологии в карточки строго в таком стиле:

      <example>
      В: Что делает митохондрия?
      О: Вырабатывает большую часть энергии клетки (АТФ).
      </example>
      <example>
      В: Где происходит фотосинтез?
      О: В хлоропластах растительных клеток.
      </example>

      Конспект:
      [вставьте конспект]
    why: "Модель копирует образец: один короткий вопрос, один короткий ответ, каждый раз одинаковое оформление."
    check:
      q: "Все ваши примеры почти одинаковые. Чем это грозит?"
      options:
        - "Модель скопирует детали, которые вы не имели в виду: например, ту же тему или длину."
        - "Ничем: одинаковые примеры — лучший вариант."
      answer: 0
      explain: "Делайте примеры разными, чтобы повторялся только нужный вам образец."
    keep: |-
      [Задача]. Придерживайся стиля этих примеров.

      <example>
      [пример 1]
      </example>
      <example>
      [пример 2, непохожий на первый]
      </example>

      Теперь сделай то же самое для:
      [ваш материал]

  - id: use-tags
    module: basics
    title: "Разделяйте части тегами"
    idea: "Когда в промпте смешаны инструкции, вводные сведения и вставленный материал, заключите каждую часть в простой тег, например <instructions> или <text>. Тогда модель не перепутает вашу просьбу с материалом, который вы вставили."
    weak: "Сделай краткое изложение и сократи и исправь ошибки вот мой текст который я вчера написал про..."
    better: |-
      <instructions>
      1. Исправь грамматические и орфографические ошибки.
      2. Затем изложи суть в трёх предложениях.
      Не меняй смысл.
      </instructions>

      <text>
      [вставьте свой текст]
      </text>
    why: "Инструкции и материал наглядно разделены, а пронумерованные шаги выполняются по порядку."
    check:
      q: "Должны ли названия тегов быть особыми ключевыми словами?"
      options:
        - "Нет. Подойдёт любое понятное название, если использовать его последовательно."
        - "Да. Модель понимает только официальные теги."
      answer: 0
      explain: "Теги — это просто ярлыки. Выбирайте названия, которые описывают содержимое, и не меняйте их по ходу промпта."
    keep: |-
      <context>
      [вводные сведения, которые нужны модели]
      </context>

      <instructions>
      [пронумерованные шаги]
      </instructions>

      <input>
      [материал, с которым нужно работать]
      </input>

  - id: give-a-role
    module: basics
    title: "Дайте модели роль"
    idea: "Одно предложение о том, кем должна быть модель, фокусирует её знания и тон. Конкретная роль работает лучше громкой."
    weak: "Проверь мой код."
    better: |-
      Ты старший Python-разработчик и проверяешь пул-реквест младшего коллеги.
      Проверь код ниже: ищи баги, непонятные имена и пропущенные граничные случаи.
      Говори прямо, но доброжелательно и объясняй каждую проблему в одном-двух предложениях.

      [вставьте код]
    why: "Роль одной строкой задаёт и планку (ревью от старшего разработчика), и тон (прямо, но доброжелательно)."
    check:
      q: "Какая роль полезнее?"
      options:
        - "«Ты величайший гений в мире»."
        - "«Ты репетитор по физике и готовишь ученика к вступительному экзамену в университет»."
      answer: 1
      explain: "Конкретная роль сообщает модели уровень, цель и аудиторию."
    keep: |-
      Ты [конкретная роль] и помогаешь [кому] с [чем].
      [Задача]

  - id: control-format
    module: basics
    title: "Управляйте форматом"
    idea: "Описывайте результат, который хотите получить, а не перечисляйте, чего не хотите. «Ответь двумя короткими абзацами» работает лучше, чем «не пиши слишком много, без списков»."
    weak: "Сравни Python и JavaScript. Без длинного текста, без маркированных списков."
    better: |-
      Сравни Python и JavaScript для новичка, который выбирает первый язык.
      Ответь таблицей из трёх столбцов: Критерий, Python, JavaScript.
      Сделай пять строк: сложность освоения, типичные применения, рынок труда, необходимые инструменты, идея первого проекта.
      После таблицы дай свою рекомендацию в двух предложениях.
    why: "Когда формат описан через то, что нужно, у модели есть одна ясная цель."
    check:
      q: "Вам нужны обычные абзацы. Какая инструкция сработает лучше?"
      options:
        - "«Пиши связным текстом, абзацами из полных предложений»."
        - "«Не используй markdown»."
      answer: 0
      explain: "Говорите модели, что делать. Это понятнее, чем говорить, чего избегать."
    keep: |-
      Ответь в виде [таблица / нумерованный список / N абзацев / JSON].
      Обязательно включи: [части или столбцы].
      Объём — не больше [объём].

  - id: let-it-think
    module: thinking
    title: "Дайте модели сначала подумать"
    idea: "В математике, логике, планировании и любой многошаговой задаче просите модель сначала рассуждать шаг за шагом, потом дать итоговый ответ, а затем проверить себя. Когда рассуждение идёт первым, ошибки становятся заметными и случаются реже."
    weak: "Поезд отправляется в 14:20 и прибывает в 17:05, по пути две остановки по 7 минут. Сколько времени он был в движении? Только ответ."
    better: |-
      Поезд отправляется в 14:20 и прибывает в 17:05, по пути у него две остановки по 7 минут каждая. Сколько времени он на самом деле был в движении?
      Реши задачу шаг за шагом, а итоговый ответ напиши отдельной строкой.
      Прежде чем закончить, ещё раз проверь вычисления.
    why: "Вы видите каждый шаг, а самопроверка ловит оплошности раньше, чем они дойдут до вас."
    check:
      q: "Когда стоит просить рассуждать шаг за шагом?"
      options:
        - "Для простых фактов, например столицы страны."
        - "Для задач из нескольких шагов, например расчётов или планов."
      answer: 1
      explain: "Простым справочным вопросам это не нужно. Многошаговым задачам — нужно."
    keep: |-
      [Задача]
      Продумай решение шаг за шагом.
      Затем напиши итоговый ответ отдельной строкой.
      Прежде чем закончить, проверь результат.

  - id: ask-for-disagreement
    module: thinking
    title: "Просите модель с вами не соглашаться"
    idea: "Модели склонны соглашаться с тем, во что вы, судя по вопросу, верите. Спросите «Хорошая ли у меня идея?» — и, скорее всего, услышите «да». Лучше попросите самую сильную критику и не выдавайте, какой вариант нравится вам."
    weak: "По-моему, моя идея стартапа отличная. Согласен?"
    better: |-
      Вот идея стартапа: [опишите её, не говоря, что она ваша].
      Представь, что ты скептически настроенный инвестор. Назови три самые веские причины, по которым идея может провалиться, от самой серьёзной к менее серьёзной.
      Затем скажи, какие доказательства заставили бы тебя изменить мнение по каждой из них.
    why: "Модель просят искать проблемы, и она не знает, какой ответ вам бы понравился."
    check:
      q: "На какой вопрос вы получите более честный ответ?"
      options:
        - "«Какие у этого плана самые слабые места?»"
        - "«Этот план надёжный, правда?»"
      answer: 0
      explain: "Наводящие вопросы приносят согласие. Нейтральные и критические — информацию."
    keep: |-
      Вот [идея / план / черновик]: [вставьте]
      Назови три самых сильных возражения, начиная с самого серьёзного.
      Не смягчай их. Затем предложи, как исправить каждое.

  - id: verify-answers
    module: thinking
    title: "Проверяйте ответы, прежде чем им доверять"
    idea: "Модель может с полной уверенностью выдать неверный факт. Разрешите ей говорить «не знаю», спрашивайте, откуда взято каждое утверждение, и всё важное проверяйте сами — в первую очередь цифры, даты, цитаты и ссылки на источники."
    weak: "Дай пять статистических фактов об использовании интернета в Узбекистане с источниками."
    better: |-
      Используя только отчёт, который я вставил ниже, перечисли статистические данные об использовании интернета.
      Для каждого показателя приведи дословно предложение, из которого он взят.
      Если чего-то в отчёте нет, напиши «в отчёте этого нет», а не додумывай.

      <report>
      [вставьте отчёт]
      </report>
    why: "Модель работает с вашим материалом, показывает, на что опирается, и может спокойно признать пробел."
    check:
      q: "Модель дала вам ссылку на научную статью. Что нужно сделать?"
      options:
        - "Использовать её. Ссылки всегда настоящие."
        - "Самостоятельно найти статью, прежде чем на неё ссылаться."
      answer: 1
      explain: "Выдуманные ссылки — хорошо известная ошибка моделей. Всегда их проверяйте."
    keep: |-
      Отвечай, используя только материал ниже.
      К каждому утверждению приведи предложение, которое его подтверждает.
      Если ответа в материале нет, так и скажи. Не додумывай.

      <material>
      [вставьте материал]
      </material>

  - id: long-documents
    module: thinking
    title: "Работайте с длинными документами"
    idea: "Если материал длинный, ставьте документ в начало, а вопрос — в конец. Если документов несколько, заключите каждый в свой тег с названием. Попросите сначала привести нужные цитаты — так ответ останется привязанным к тексту."
    weak: "Какие основные риски? [сначала вопрос, а после него вставлено двадцать страниц]"
    better: |-
      <document name="project_plan">
      [вставьте документ 1]
      </document>
      <document name="budget">
      [вставьте документ 2]
      </document>

      Сначала приведи цитаты из обоих документов, где говорится о рисках.
      Затем, опираясь только на эти цитаты, перечисли три основных риска и укажи, из какого документа взят каждый.
    why: "Вопрос стоит прямо перед ответом, а цитаты не дают модели уйти от текста."
    check:
      q: "Где в промпте должен стоять длинный документ?"
      options:
        - "В начале, а вопрос — после него."
        - "В самом конце, после всех инструкций."
      answer: 0
      explain: "На длинных текстах порядок «сначала материал, потом вопрос» даёт более точные ответы."
    keep: |-
      <document name="[название]">
      [вставьте документ]
      </document>

      Сначала приведи цитаты, которые относятся к вопросу: [вопрос].
      Затем ответь, используя только эти цитаты.

  - id: iterate
    module: thinking
    title: "Считайте первый промпт черновиком"
    idea: "Хороший промпт редко получается с первой попытки. Прочитайте ответ, назовите, что не так, и скажите, что изменить. Можно также попросить модель улучшить ваш промпт или задать вам вопросы перед началом работы."
    weak: "Нет, плохо. Попробуй ещё раз."
    better: |-
      Уже близко. Структуру оставь, но:
      1. Сократи введение вдвое.
      2. Замени второй пример на пример про футбол.
      3. Используй слова попроще: я объясняю это четырнадцатилетнему подростку.
    why: "Конкретные замечания показывают модели, что оставить, а что изменить."
    check:
      q: "Ответ хорош на 70%. Как быстрее всего довести его до конца?"
      options:
        - "Начать новый чат и надеяться на лучший результат."
        - "Точно сказать, что оставить и что изменить."
      answer: 1
      explain: "Точечные правки приводят к цели быстрее, чем начинать заново."
    keep: |-
      Прежде чем начать, задай мне до пяти вопросов обо всём, что непонятно.
      ---
      Оставь [что получилось хорошо]. Измени [что исправить], потому что [причина].

  - id: brief-an-agent
    module: agents
    title: "Поручите работу агенту"
    idea: "Агент (Claude Code, режим агента в ChatGPT и похожие инструменты) выполняет много шагов без вашего участия. Ему нужен не вопрос, а техзадание: цель, как выглядит «готово», что нельзя трогать и когда остановиться и спросить."
    weak: "Сделай мой сайт лучше."
    better: |-
      Цель: добавить переключатель тёмной темы на мой личный сайт в этой папке.
      Критерий готовности: кнопка в шапке переключает темы, выбор сохраняется после перезагрузки страницы, обе темы хорошо читаются.
      Ограничения: только чистые CSS и JavaScript, никаких новых библиотек. Содержимое страниц не менять.
      Перед тем как править файлы, изложи план в нескольких строках. Если что-то неясно, спроси, а не додумывай.
      В конце перечисли изменённые файлы и расскажи, как ты проверил результат.
    why: "Агент знает цель, границы и то, как будут оценивать его работу, поэтому может работать сам и не уходить в сторону."
    check:
      q: "О какой части техзадания для агента забывают чаще всего?"
      options:
        - "О чётком определении того, что значит «готово»."
        - "О приветствии."
      answer: 0
      explain: "Без финишной черты агент либо останавливается слишком рано, либо продолжает что-то менять."
    keep: |-
      Цель: [чего нужно добиться и зачем]
      Критерий готовности: [проверки, которые подтверждают, что всё работает]
      Ограничения: [инструменты, файлы или действия под запретом]
      Спроси меня перед: [рискованные или необратимые шаги]
      Отчёт: [что сообщить мне в конце]

  - id: prompts-for-code
    module: agents
    title: "Промпты для кода"
    idea: "Для кода дайте то же, что даёт хороший баг-репорт: что вы ожидали, что произошло, точный текст ошибки и как её воспроизвести. Просите сначала причину, а потом исправление, и общее решение, а не такое, которое лишь заставляет тест пройти."
    weak: "Мой код не работает. Исправь."
    better: |-
      Эта функция на Python должна возвращать среднее значение списка, но на пустом списке она падает.

      Ожидалось: average([]) возвращает 0.
      На деле: ZeroDivisionError: division by zero.

      <code>
      def average(nums):
          return sum(nums) / len(nums)
      </code>

      Сначала объясни причину в одном-двух предложениях. Затем дай минимальное исправление и тест для случая с пустым списком.
      Не переписывай код, который и так работает.
    why: "Ожидаемое и фактическое поведение прямо указывают на баг, а «минимальное исправление» защищает от ненужного переписывания."
    check:
      q: "Что всегда должно быть в промпте для отладки?"
      options:
        - "Точный текст ошибки и то, что вы ожидали получить."
        - "Пометка, что баг срочный."
      answer: 0
      explain: "Текст ошибки и ожидаемый результат — два самых полезных факта."
    keep: |-
      Язык и версия: [например, Python 3.12]
      Ожидалось: [что должно происходить]
      На деле: [что происходит, с точным текстом ошибки]
      Как воспроизвести: [шаги]

      <code>
      [вставьте нужный фрагмент кода]
      </code>

      Сначала объясни причину, затем дай минимальное исправление и тест.

  - id: custom-instructions
    module: agents
    title: "Настройте модель, чтобы она вас помнила"
    idea: "Если вы в каждом чате повторяете одни и те же вводные, сохраните их один раз. В ChatGPT для этого есть пользовательские инструкции и память, в Claude — проекты, стили и настройки профиля. Напишите две короткие заметки: кто вы и какие ответы вам удобны."
    weak: "(В каждом новом чате набирать «Я студент второго курса, изучаю информатику, отвечай просто».)"
    better: |-
      Обо мне: студент второго курса, изучаю информатику в Ташкенте. Хорошо знаю Python, учу C++ и алгоритмы. Читаю на английском, узбекском и русском.

      Как отвечать: начинай с прямого ответа. Пиши короткими абзацами. Сначала показывай код, потом теорию. Если я ошибаюсь, говори об этом прямо. Если не уверен в каком-то факте, так и скажи.
    why: "Каждый новый чат начинается уже с вашим контекстом, поэтому даже на короткие промпты приходят ответы, рассчитанные именно на вас."
    check:
      q: "Что стоит хранить в сохранённых инструкциях?"
      options:
        - "Устойчивые факты о вас и удобный вам стиль ответов."
        - "Полный текст сегодняшнего домашнего задания."
      answer: 0
      explain: "Сохраняйте то, что остаётся верным месяцами. Детали конкретной задачи пишите в самом чате."
    keep: |-
      Обо мне: [роль, уровень, область, языки]
      Мои цели: [к чему вы идёте]
      Как отвечать: [объём, тон, формат, что делать при неуверенности]

  - id: chain-prompts
    module: advanced
    title: "Разбейте большую работу на цепочку"
    idea: "Один гигантский промпт для большой работы даёт средний результат на каждом этапе. Разбейте работу на шаги: у каждого шага одна задача, а его результат становится входом для следующего. Между шагами результат можно посмотреть и поправить, так что ранняя ошибка не испортит всё, что идёт после неё."
    weak: "Изучи рынок электромобилей в Узбекистане и напиши мне полный отчёт с выводами."
    better: |-
      Сделаем это в четыре шага. Сейчас выполни только шаг 1 и жди моего ответа.

      Шаг 1: перечисли десять вопросов, на которые должен отвечать хороший отчёт об электромобилях в Узбекистане.
      Шаг 2: по каждому вопросу, который я одобрю, собери факты с источниками.
      Шаг 3: составь по этим фактам план отчёта.
      Шаг 4: напиши отчёт по плану.
    why: "Каждый шаг достаточно мал, чтобы выполнить его хорошо, а направление вы утверждаете до того, как силы потрачены на следующий шаг."
    check:
      q: "В чём главное преимущество цепочки перед одним длинным промптом?"
      options:
        - "Каждый этап можно проверить и исправить до того, как на него опрётся следующий."
        - "В ней всегда меньше слов."
      answer: 0
      explain: "Цепочка даёт контрольные точки. Ошибки ловятся там, где они возникают."
    keep: |-
      Будем работать по шагам. Сейчас выполни только шаг 1, затем остановись и жди.

      Шаг 1: [первая небольшая задача]
      Шаг 2: [использует результат шага 1]
      Шаг 3: [использует результат шага 2]

      После каждого шага покажи результат и спроси, продолжать ли.

  - id: spec-first
    module: advanced
    title: "Сначала техзадание, потом код"
    idea: "Агент, который начинает писать код по идее из одной строки, заполняет каждый пробел собственными догадками. Пусть сначала расспросит вас и напишет короткое техзадание: что программа делает, чего не делает и как вы поймёте, что она работает. Прочитайте техзадание и поправьте его. Только после этого разрешайте агенту приступать к работе."
    weak: "Сделай мне приложение со списком дел."
    better: |-
      Мне нужно приложение со списком дел. Код пока не пиши.
      Сначала задавай мне вопросы, по одному за раз, пока не поймёшь, кто пользователи, какие нужны функции и что в задачу не входит.
      Затем напиши техзадание на одну страницу: цель, функции, что не входит, какие данные хранятся и пять проверок, которые доказывают, что всё работает.
      Дождись, пока я утвержу техзадание, и только потом пиши код.
    why: "Исправить предложение в техзадании — дело нескольких секунд. Исправить то же недопонимание в готовом коде — дело нескольких часов."
    check:
      q: "Когда исправить недопонимание дешевле всего?"
      options:
        - "После того как код готов."
        - "В техзадании, пока кода ещё нет."
      answer: 1
      explain: "Сначала согласуйте план на словах. Переделывать код дорого."
    keep: |-
      Я хочу сделать [идея]. Код пока не пиши.
      1. Задавай мне вопросы по одному, пока требования не станут ясны.
      2. Напиши короткое техзадание: цель, функции, что не входит, проверки, которые доказывают, что всё работает.
      3. Дождись моего одобрения.
      4. Затем реализуй шаг за шагом, сверяя каждый шаг с техзаданием.

  - id: keep-state
    module: advanced
    title: "Сохраняйте состояние в долгих задачах"
    idea: "Долгая задача не умещается в одну сессию, а новая сессия ничего не помнит. Пусть агент хранит свою память в файлах: заметка о ходе работы с тем, что сделано и что дальше, список дел и тесты, которые показывают, что работает. Новая сессия начинается с их чтения."
    weak: "Продолжи то, что мы делали вчера."
    better: |-
      Эта задача займёт несколько сессий. Веди файл progress.md и обновляй его после каждого законченного шага: что сделано, что дальше, какие решения приняты и почему, какие есть известные проблемы.
      После каждого шага делай коммит рабочего кода.
      В начале каждой сессии прочитай progress.md и недавнюю историю коммитов, в трёх строках скажи мне, на чём мы остановились, и затем продолжай.
    why: "Память хранится в файлах, поэтому ничего не зависит от того, сохранится ли история чата."
    check:
      q: "Начинается новая сессия. Что агент должен сделать первым делом?"
      options:
        - "Прочитать заметки о ходе работы и недавние изменения."
        - "На всякий случай начать всё с начала."
      answer: 0
      explain: "Записанное состояние позволяет продолжить работу ровно с того места, где она остановилась."
    keep: |-
      Веди файл с ходом работы и обновляй его после каждого шага:
      - Сделано: [законченные шаги]
      - Дальше: [следующий шаг]
      - Решения: [что решено и почему]
      - Проблемы: [открытые вопросы]
      В начале каждой сессии сначала прочитай его и кратко изложи, на чём мы остановились.

  - id: research-hypotheses
    module: advanced
    title: "Исследуйте с конкурирующими гипотезами"
    idea: "Когда модель просят исследовать вопрос, она обычно находит первый правдоподобный ответ и останавливается. Попросите её держать в уме сразу несколько возможных объяснений, искать доводы за и против каждого, указывать степень уверенности и проверять важные утверждения больше чем по одному источнику."
    weak: "Почему в прошлом месяце у нашего приложения упало число пользователей?"
    better: |-
      В прошлом месяце число ежедневных пользователей нашего приложения упало на 20%. Данные приложены.
      Перечисли не меньше четырёх возможных объяснений.
      Для каждого укажи: какие данные его подтвердили бы, какие опровергли бы и что ты видишь на самом деле.
      Каждому дай уровень уверенности (низкий, средний, высокий) и скажи, какие дополнительные данные поставили бы точку в вопросе.
      Не выбирай победителя, если данные не говорят об этом однозначно.
    why: "Несколько гипотез не дают модели зациклиться на первой версии, а уровни уверенности показывают, где ответ слаб."
    check:
      q: "Зачем просить ещё и доводы против каждого объяснения?"
      options:
        - "Это не даёт модели подтверждать только первую пришедшую ей идею."
        - "Так ответ получается длиннее и внушительнее."
      answer: 0
      explain: "Поиск опровергающих данных — основа честного исследования."
    keep: |-
      Вопрос: [что вы хотите выяснить]
      1. Перечисли несколько возможных ответов или объяснений.
      2. Для каждого: доводы за, доводы против, уверенность (низкая / средняя / высокая).
      3. Проверь ключевые факты минимум по двум независимым источникам и укажи источники.
      4. Скажи, что остаётся неизвестным и что помогло бы это прояснить.

  - id: recurring-job
    module: advanced
    title: "Превратите повторяющуюся задачу в готовое задание"
    idea: "Если вы просите об одном и том же каждый день или каждую неделю, опишите это один раз как задание: фиксированные источники, фиксированный формат, правило, что считать достойным упоминания, и разрешение сказать, что ничего не изменилось. Сначала запустите его вручную, а когда результат вас устроит, поставьте на расписание."
    weak: "Что сегодня нового в ИИ?"
    better: |-
      Задание: ежедневная сводка.
      Источники: [три сайта или ленты, которым вы доверяете].
      Сообщай только новости за последние 24 часа на темы: [ваши темы].
      Формат: не больше пяти пунктов. Для каждого: краткое изложение в одном предложении, почему это важно для инженера по компьютерному зрению, и ссылка.
      Если ничего важного не произошло, напиши «Сегодня ничего важного» и остановись. Не раздувай список.
    why: "Один и тот же промпт каждый день даёт сопоставимый результат, а правило для пустого дня сохраняет сводку честной."
    check:
      q: "Зачем добавлять правило для дней, когда ничего не произошло?"
      options:
        - "Без него модель заполнит список неважными пунктами."
        - "Так промпт становится короче."
      answer: 0
      explain: "Модель, у которой попросили пять пунктов, обычно и выдаёт пять. Разрешите ей вернуть меньше."
    keep: |-
      Задание: [название], запускается [ежедневно / еженедельно].
      Источники: [где искать]
      Включай только: [что считается важным и за какой период]
      Формат: [число пунктов, поля для каждого]
      Сравни с прошлым разом: [что изменилось]
      Если ничего нового нет, так и скажи и остановись.

  - id: numbers-and-scenarios
    module: advanced
    title: "Анализируйте цифры через сценарии"
    idea: "В любом вопросе, где есть цифры, давайте реальные данные и просите больше одного ответа: ожидаемый вариант, лучший и худший, причём все допущения должны быть выписаны отдельно. Затем попросите показать расчёты и проверьте одну строку вручную."
    weak: "Могу ли я позволить себе учёбу за границей?"
    better: |-
      Мои данные: сбережения 4 000 USD, доход 300 USD в месяц, плата за обучение 6 000 USD в год, расходы на жизнь около 700 USD в месяц, возможна стипендия, которая покроет половину платы за обучение.
      Составь бюджет на 12 месяцев в трёх сценариях: ожидаемый, лучший, худший.
      Вынеси все допущения в отдельную таблицу, чтобы я мог их менять.
      Для каждого сценария скажи, в каком месяце закончатся деньги, если это произойдёт.
      Покажи расчёт для ожидаемого сценария шаг за шагом.
    why: "Три сценария показывают диапазон вместо одного обманчиво точного числа, а видимые допущения можно оспорить и изменить."
    check:
      q: "Зачем просить вынести допущения в отдельную таблицу?"
      options:
        - "Чтобы видеть и менять то, от чего зависит результат."
        - "Чтобы ответ выглядел профессиональнее."
      answer: 0
      explain: "Прогноз хорош ровно настолько, насколько хороши его допущения. Держите их под рукой."
    keep: |-
      Мои цифры: [реальные данные или приложенный файл]
      Вопрос: [что вы хотите узнать]
      Построй три сценария: ожидаемый, лучший, худший.
      Перечисли все допущения отдельно.
      Покажи расчёты для ожидаемого сценария, чтобы я мог их проверить.

  - id: sources-to-slides
    module: advanced
    title: "От источников к презентации"
    idea: "Хорошая презентация — это аргумент, а не груда фактов. Стройте её по порядку: сначала одна главная мысль, затем сюжетная линия, где на каждый слайд приходится один тезис, и только потом сами слайды, каждый из которых подкреплён данными из ваших источников. Определитесь с сюжетом до того, как написан первый слайд."
    weak: "Сделай по этим статьям презентацию о возобновляемой энергетике."
    better: |-
      <sources>
      [вставьте статьи или заметки]
      </sources>

      Аудитория: моя университетская группа, 10 минут, основы они знают.
      Шаг 1: предложи одно предложение, которое слушатели должны запомнить.
      Шаг 2: напиши сюжетную линию из семи слайдов. Заголовок каждого слайда — полное предложение, в котором сформулирован его тезис.
      Здесь остановись и жди моего одобрения.
      Шаг 3: для каждого слайда дай три коротких пункта, источник каждого факта и заметки докладчика примерно на 60 слов.
    why: "Заголовки-тезисы заставляют выстроить ясный аргумент, а утверждённая заранее сюжетная линия избавляет от переписывания каждого слайда."
    check:
      q: "Какой заголовок слайда сильнее?"
      options:
        - "«Солнечная энергия»"
        - "«Солнечная энергия сегодня — самый дешёвый новый источник электричества в большинстве стран»"
      answer: 1
      explain: "Заголовок, в котором сформулирован тезис, подсказывает слушателям, какой вывод сделать."
    keep: |-
      Аудитория: [кто, сколько времени, что они уже знают]
      1. Предложи одну главную мысль, которую нужно запомнить.
      2. Напиши сюжетную линию: по одному заголовку в виде полного предложения на каждый слайд.
      3. Дождись моего одобрения.
      4. Для каждого слайда: пункты, источник каждого факта, заметки докладчика.

  - id: consistent-voice
    module: advanced
    title: "Сохраняйте единый голос во многих текстах"
    idea: "Чтобы получить много текстов, которые звучат как вы или ваш проект, не описывайте стиль по памяти. Дайте реальные образцы, попросите модель вывести из них правила голоса в виде короткого руководства, поправьте его и затем прикладывайте к каждому запросу."
    weak: "Напиши десять постов для моего Telegram-канала в моём стиле."
    better: |-
      <samples>
      [вставьте пять своих реальных постов]
      </samples>

      Шаг 1: изучи образцы и напиши руководство по голосу: длина предложений, характерные слова, чего я никогда не делаю, как я начинаю и заканчиваю пост. Не больше десяти правил, к каждому — пример из образцов.
      Дождись моих правок.
      Шаг 2: по исправленному руководству напиши три поста на темы: [темы]. После каждого назови два правила, которым он следует наиболее явно.
    why: "Руководство превращает смутное ощущение в явные правила, которые можно проверять, исправлять и использовать снова."
    check:
      q: "Что лучше всего взять за основу для руководства по голосу?"
      options:
        - "Прилагательные вроде «дружелюбный и профессиональный»."
        - "Реальные образцы текстов, на которые должен быть похож результат."
      answer: 1
      explain: "Образцы показывают голос. Прилагательные его только называют."
    keep: |-
      <samples>
      [3–5 реальных примеров]
      </samples>

      1. Составь руководство по голосу: не больше десяти правил, к каждому — пример.
      2. Дождись моих правок.
      3. Напиши [что], следуя руководству.

  - id: stay-in-control
    module: advanced
    title: "Держите агента под контролем"
    idea: "Агент с инструментами может удалять файлы, отправлять сообщения и тратить деньги. Скажите, какие действия ему разрешены свободно, а какие требуют вашего одобрения. Хорошо работает простое правило: всё, что можно отменить, разрешено, а обо всём, что отменить нельзя или что увидят другие люди, нужно сначала спросить. Попросите агента делать только то, о чём его просили."
    weak: "Наведи порядок в папке моего проекта."
    better: |-
      Наведи порядок в папке проекта.
      Тебе можно свободно: читать любые файлы, создавать новые папки и перемещать файлы внутри проекта.
      Спроси меня перед тем, как: что-либо удалять, менять файлы, которые отслеживает git, или что-либо устанавливать.
      Делай только то, о чём я попросил. Если заметишь другие проблемы, перечисли их в конце, а не исправляй.
      В конце дай список всех изменений, которые ты внёс.
    why: "С безопасными действиями агент справляется быстро, а рискованные всегда проходят через вас."
    check:
      q: "О каком действии агент всегда должен сначала спросить?"
      options:
        - "О чтении файла."
        - "Об удалении файлов или отправке сообщения другим людям."
      answer: 1
      explain: "Необратимые действия и действия, которые увидят другие люди, требуют вашего одобрения."
    keep: |-
      Тебе можно свободно: [безопасные, обратимые действия]
      Спроси меня перед: [удалением, отправкой, оплатой, публикацией, установкой]
      Делай только то, о чём я попросил. Другие замеченные проблемы перечисли, но не исправляй.
      В конце перечисли все изменения, которые ты внёс.

  - id: honest-code
    module: advanced
    title: "Просите настоящее решение, а не пройденные тесты"
    idea: "Агент-программист, которому сказали «сделай так, чтобы тесты проходили», может сделать ровно это и ничего больше — например, обработать только те входные данные, которые есть в тестах. Просите решение, которое работает для всех корректных входных данных, велите читать код, прежде чем что-то о нём утверждать, и попросите сообщать, если неправильным выглядит сам тест."
    weak: "Тесты падают. Сделай так, чтобы они проходили."
    better: |-
      В test_parser.py падают три теста.
      Прежде чем отвечать, прочитай код парсера и тесты. Не строй догадок о коде, который ты не открывал.
      Найди настоящую причину и исправь её так, чтобы парсер работал для всех корректных входных данных, а не только для тех, что есть в тестах.
      Не правь тесты, чтобы они проходили. Если тест выглядит неправильным, остановись и объясни почему.
      Затем запусти весь набор тестов и сообщи результат в точности, включая все падения.
    why: "Цель сформулирована как правильное поведение, поэтому обходные пути, которые лишь удовлетворяют тесты, исключены."
    check:
      q: "Агент говорит «всё исправлено», но запуска тестов вы не видели. Что вы попросите?"
      options:
        - "«Запусти тесты и покажи мне вывод»."
        - "Ничего. Раз говорит, что исправлено, значит, исправлено."
      answer: 0
      explain: "Просите доказательства. Заявление об успехе — это не результат тестов."
    keep: |-
      Прежде чем отвечать, прочитай нужный код. Не строй догадок.
      Исправь настоящую причину так, чтобы всё работало для всех корректных входных данных, а не только для тех, что есть в тестах.
      Тесты не меняй. Если тест выглядит неправильным, скажи мне.
      Запусти тесты и сообщи точный результат.

  - id: system-prompt
    module: advanced
    title: "Напишите системный промпт для своего бота"
    idea: "Когда вы строите бота или приложение поверх модели, системный промпт — это его должностная инструкция. Опишите роль, пользователей, то, что бот должен знать, правила вместе с их причинами, формат ответа и что делать, если он чего-то не знает. Затем проверьте промпт на реальных вопросах, в том числе враждебных и не по теме."
    weak: "Ты полезный ассистент моего магазина."
    better: |-
      Ты ассистент службы поддержки книжного интернет-магазина в Ташкенте. Покупатели пишут на узбекском или русском; отвечай на языке их сообщения.

      <knowledge>
      [условия доставки, цены, правила возврата]
      </knowledge>

      Правила:
      - Отвечай только на основе знаний выше. Если ответа там нет, скажи, что передашь вопрос человеку, потому что неверный ответ о ценах стоит нам покупателей.
      - Укладывай ответ в три предложения, потому что покупатели читают их с телефона.
      - Никогда не проси номера карт, потому что оплата проходит только на сайте.
    why: "Бот знает свою роль, свои границы и причину каждого правила, поэтому ведёт себя разумно и в случаях, которые вы не перечислили."
    check:
      q: "Что нужно сделать после того, как системный промпт написан?"
      options:
        - "Проверить его на реальных, трудных и не относящихся к теме вопросах."
        - "Сразу же опубликовать."
      answer: 0
      explain: "Системный промпт остаётся черновиком, пока его не проверили на трудных случаях."
    keep: |-
      Ты [роль] для [пользователи]. [Язык и тон.]

      <knowledge>
      [факты, на которые бот может опираться]
      </knowledge>

      Правила:
      - [правило], потому что [причина].
      - Если не знаешь, [что делать].
      Формат: [объём и структура ответов]

prompts:
  - id: explain-three-levels
    cat: study
    title: "Объяснение на трёх уровнях"
    use: "Тема кажется слишком сложной или слишком абстрактной."
    text: |-
      Объясни [тема] на трёх уровнях:
      1. Десятилетнему ребёнку, в трёх предложениях.
      2. Старшекласснику, с одним примером из повседневной жизни.
      3. Студенту первого курса, с правильными терминами.
      Затем назови одну мысль, которую я должен понять прежде всего остального.

  - id: quiz-me
    cat: study
    title: "Опрашивай меня, пока не выучу"
    use: "Перед экзаменом, чтобы найти пробелы."
    text: |-
      Я готовлюсь к экзамену по [предмет / тема].
      Задавай мне по одному вопросу, начиная с простых и постепенно усложняя.
      После каждого ответа говори, верно ли я ответил, коротко объясняй и задавай следующий вопрос.
      После десяти вопросов перечисли темы, которые мне стоит повторить.

  - id: study-plan
    cat: study
    title: "План подготовки"
    use: "Срок поджимает, а материала слишком много."
    text: |-
      До [экзамен / дедлайн] по [предмет] у меня осталось [число] дней.
      Я могу заниматься [часы] часов в день. Темы: [список].
      Хуже всего я знаю: [темы].
      Составь план по дням в виде таблицы: день, темы, задание, как проверить себя.
      Последний день оставь только на повторение.

  - id: notes-to-summary
    cat: study
    title: "Из сумбурных записей — в конспект"
    use: "После лекции, когда записи в беспорядке."
    text: |-
      Ниже мои необработанные записи с лекции. Приведи их в порядок:
      1. Краткое изложение в пяти предложениях.
      2. Ключевые термины с определениями в одну строку.
      3. Три вопроса, которые могут попасться на экзамене.
      Не добавляй фактов, которых нет в моих записях. Всё непонятное пометь [?].

      <notes>
      [вставьте записи]
      </notes>

  - id: feynman-check
    cat: study
    title: "Проверь, как я понял тему"
    use: "Вам кажется, что вы поняли тему, и вы хотите в этом убедиться."
    text: |-
      Я объясню [тема] своими словами. Будь строгим, но справедливым преподавателем.
      Укажи, что неверно, чего не хватает и что сказано неточно.
      Полное правильное объяснение пока не давай. Задай мне два вопроса, которые помогут мне исправить ошибки самому.

      Моё объяснение:
      [напишите своё объяснение]

  - id: explain-code
    cat: coding
    title: "Объясни этот код"
    use: "Вам достался чужой код или вы скопировали код, который не понимаете."
    text: |-
      Объясни, что делает этот код, человеку, который знает основы [язык].
      Сначала дай общее описание в двух предложениях. Затем разбери код блок за блоком.
      Укажи на всё необычное или рискованное.

      <code>
      [вставьте код]
      </code>

  - id: debug
    cat: coding
    title: "Найди баг"
    use: "Код падает или выдаёт неверный результат."
    text: |-
      Язык и версия: [например, Python 3.12]
      Что я ожидал: [ожидаемое поведение]
      Что происходит: [фактическое поведение и точный текст ошибки]

      <code>
      [вставьте код]
      </code>

      Сначала объясни причину. Затем дай минимальное исправление. Не переписывай то, что работает.

  - id: code-review
    cat: coding
    title: "Сделай ревью моего кода"
    use: "Перед сдачей задания или отправкой пул-реквеста."
    text: |-
      Ты старший разработчик на [язык] и проверяешь код младшего коллеги.
      Проверь: баги, граничные случаи, непонятные имена, повторяющийся код и проблемы безопасности.
      Перечисли замечания в порядке важности. Для каждого покажи строку и предложи исправление.
      В конце назови одну вещь, которая у меня получилась хорошо.

      <code>
      [вставьте код]
      </code>

  - id: write-tests
    cat: coding
    title: "Напиши тесты"
    use: "Функция есть, а тестов нет."
    text: |-
      Напиши модульные тесты для функции ниже, используя [фреймворк для тестов].
      Покрой обычный случай, граничные случаи (пустой ввод, очень большой ввод, неверные типы) и один случай, в котором должна возникать ошибка.
      Назови каждый тест так, чтобы было понятно, что он проверяет. Саму функцию не меняй.

      <code>
      [вставьте функцию]
      </code>

  - id: learn-by-project
    cat: coding
    title: "Освоить технологию через проект"
    use: "Вы хотите изучить новый язык или библиотеку на практике."
    text: |-
      Я знаю [что вы уже знаете] и хочу изучить [технология].
      Придумай один небольшой проект, который я смогу закончить за [срок] и который научит меня основным идеям.
      Разбей его на пять шагов. Для каждого шага скажи, чему я научусь и как проверить, что всё работает.
      Не пиши код за меня. Давай подсказки, только когда я попрошу.

  - id: improve-draft
    cat: writing
    title: "Улучши черновик, сохрани мой стиль"
    use: "Текст почти готов, но ещё сырой."
    text: |-
      Улучши текст ниже. Исправь грамматику, убери повторы и сделай неясные предложения понятнее.
      Сохрани мой стиль и смысл. Не делай текст более официальным, чем он есть.
      После текста перечисли пять самых важных правок и объясни, зачем ты их внёс.

      <text>
      [вставьте текст]
      </text>

  - id: formal-email
    cat: writing
    title: "Официальное письмо"
    use: "Вы пишете преподавателю, в университет или работодателю."
    text: |-
      Напиши вежливое короткое письмо [кому: например, моему преподавателю].
      Цель: [о чём вы просите или сообщаете].
      Факты, которые нужно упомянуть: [даты, имена, детали].
      Тон: уважительный, но не казённый. Не больше 120 слов. Предложи также тему письма.

  - id: essay-outline
    cat: writing
    title: "План эссе"
    use: "Тема есть, а страница пустая."
    text: |-
      Мне нужно написать эссе на [объём] слов на тему: [тема].
      Моя позиция: [ваше мнение или «ещё не определился»].
      Составь план: тезис одним предложением, три основных аргумента с одним доказательством к каждому, один контраргумент и идея для заключения.
      Само эссе не пиши.

  - id: shorten
    cat: writing
    title: "Сократи текст"
    use: "Вы превысили лимит слов."
    text: |-
      Сократи текст ниже примерно до [число] слов.
      Сохрани все ключевые факты и исходный порядок. В первую очередь убирай повторы, «воду» и слабые примеры.
      Затем скажи, что ты убрал.

      <text>
      [вставьте текст]
      </text>

  - id: natural-translation
    cat: writing
    title: "Естественный перевод"
    use: "Нужен перевод, который не звучит как перевод."
    text: |-
      Переведи текст ниже с [язык] на [язык].
      Переводи смысл, а не слово в слово, чтобы текст читался так, будто его написал носитель языка.
      Имена, числа и технические термины передавай точно.
      Если у фразы нет хорошего эквивалента, дай лучший вариант и объясни свой выбор в примечании.

      <text>
      [вставьте текст]
      </text>

  - id: compare-options
    cat: research
    title: "Сравни варианты и помоги выбрать"
    use: "Вы выбираете между инструментами, курсами, ноутбуками или университетами."
    text: |-
      Я выбираю между: [вариант A], [вариант B], [вариант C].
      Что для меня важно, по порядку: [критерии].
      Моя ситуация: [бюджет, уровень, сроки].
      Сравни варианты в таблице по моим критериям. Затем порекомендуй один и скажи, при каких условиях ты выбрал бы другой.
      Если не уверен в каком-то факте, пометь его [проверить].

  - id: summarize-source
    cat: research
    title: "Изложи статью с доказательствами"
    use: "Вы читаете длинную статью или научную работу."
    text: |-
      <article>
      [вставьте статью]
      </article>

      Изложи суть статьи выше:
      1. Главное утверждение одним предложением.
      2. Три самых сильных доказательства, каждое с дословной цитатой.
      3. Что статья не доказывает или оставляет открытым.
      Используй только то, что есть в статье.

  - id: devils-advocate
    cat: research
    title: "Поспорь с моей позицией"
    use: "Перед дебатами, защитой диплома или важным решением."
    text: |-
      Вот позиция: [сформулируйте её нейтрально].
      Приведи три самых сильных аргумента против неё — так, как это сделал бы хорошо подготовленный оппонент.
      Для каждого скажи, как на него лучше всего ответить защитнику этой позиции.
      Не говори, какая сторона права.

  - id: research-questions
    cat: research
    title: "Найди хорошие исследовательские вопросы"
    use: "Вы начинаете курсовую или дипломную работу."
    text: |-
      Моя область — [область], меня интересует [широкая тема].
      У меня есть [срок] и доступ к [данные, инструменты, лаборатория].
      Предложи пять исследовательских вопросов, достаточно узких, чтобы успеть довести работу до конца.
      Для каждого укажи: почему он важен, какие данные мне нужны и в чём главный риск.

  - id: extract-table
    cat: research
    title: "Собери данные в таблицу"
    use: "Факты разбросаны по тексту."
    text: |-
      Из текста ниже извлеки все [тип элементов: например, компании, даты, цены] и собери в таблицу со столбцами: [столбцы].
      Одна строка на элемент. Если значения нет, пиши «н/д». Не додумывай.

      <text>
      [вставьте текст]
      </text>

  - id: cv-bullets
    cat: career
    title: "Сильные пункты резюме"
    use: "В резюме перечислены обязанности, а не результаты."
    text: |-
      Перепиши эти пункты резюме под вакансию [желаемая должность].
      Каждый пункт начинай с сильного глагола и показывай результат в цифрах там, где я их дал.
      Не выдумывай цифры и достижения. Если результата не хватает, спроси меня.

      [вставьте пункты резюме]

  - id: mock-interview
    cat: career
    title: "Пробное собеседование"
    use: "Вы готовитесь к собеседованию на работу или стажировку."
    text: |-
      Проведи со мной собеседование на должность [должность] в [тип компании].
      Задавай по одному вопросу: сначала общие, потом технические, потом о ситуации из прошлого опыта.
      После каждого ответа дай короткий отзыв: что было сильным, чего не хватило и как сказать лучше.
      После шести вопросов дай общую оценку.

  - id: cover-letter
    cat: career
    title: "Сопроводительное письмо на основе реального опыта"
    use: "Вы подаёте заявку на работу, стажировку или стипендию."
    text: |-
      Напиши сопроводительное письмо не длиннее 250 слов на эту вакансию:
      <job>
      [вставьте описание вакансии]
      </job>

      Мой опыт:
      <me>
      [вставьте резюме или ключевые факты]
      </me>

      Используй только факты из моего опыта. Свяжи два примера из него с требованиями вакансии. Тон простой и уверенный, без штампов.

  - id: learning-roadmap
    cat: career
    title: "Дорожная карта к навыку"
    use: "Вы знаете, куда хотите прийти, но не знаете пути."
    text: |-
      Я хочу стать [цель: например, джуниор-бэкенд-разработчиком] за [срок].
      Я уже знаю: [навыки]. Могу уделять [часы] часов в неделю.
      Составь дорожную карту по месяцам: что изучать, один проект в месяц и как понять, что я готов двигаться дальше.
      Отдавай предпочтение бесплатным ресурсам. Скажи, что можно спокойно пропустить.

  - id: portfolio-project
    cat: career
    title: "Идеи проектов для портфолио"
    use: "Нужны проекты, которые показывают настоящие навыки."
    text: |-
      Я студент [уровень], изучаю [область] и знаю [технологии].
      Предложи пять проектов для портфолио, которые произведут впечатление на работодателя, нанимающего на должность [должность].
      Для каждого укажи: какую проблему он решает, какие навыки показывает, сколько недель займёт и что в нём самое сложное.
      Не предлагай самые распространённые проекты из туториалов.

  - id: improve-my-prompt
    cat: meta
    title: "Улучши мой промпт"
    use: "Промпт даёт слабые результаты, и вы не понимаете почему."
    text: |-
      Вот промпт, который я написал:
      <prompt>
      [вставьте свой промпт]
      </prompt>

      Что я хотел получить: [цель]. Что получил вместо этого: [проблема].
      Объясни, что в моём промпте неясно или чего в нём не хватает. Затем напиши улучшенную версию и перечисли, что ты изменил.

  - id: ask-me-first
    cat: meta
    title: "Сначала задай мне вопросы"
    use: "Задача большая, и вы не уверены, что именно нужно написать."
    text: |-
      Я хочу, чтобы ты помог мне с: [задача].
      Прежде чем начать, задай мне вопросы, ответы на которые нужны тебе, чтобы сделать это хорошо: по одному, не больше пяти.
      Затем кратко изложи, что ты понял, и дождись моего подтверждения.

  - id: agent-brief
    cat: meta
    title: "Преврати задачу в техзадание для агента"
    use: "Перед тем как поручить ИИ-агенту многошаговую работу."
    text: |-
      Преврати мою черновую просьбу в чёткое техзадание для ИИ-агента.
      Используй такие заголовки: Цель, Критерий готовности, Ограничения, Спроси меня перед, Итоговый отчёт.
      Если в моей просьбе не хватает чего-то для какого-либо заголовка, спроси меня, а не выдумывай.

      Моя просьба: [опишите задачу своими словами]

  - id: custom-instructions-writer
    cat: meta
    title: "Напиши мои пользовательские инструкции"
    use: "Вы настраиваете ChatGPT или Claude под себя."
    text: |-
      Расспроси меня, чтобы написать мои пользовательские инструкции.
      Спроси о моей роли и уровне, о том, для чего я использую ИИ, какой длины ответы мне нравятся и что меня раздражает в ответах ИИ.
      Задавай по одному вопросу. Затем напиши два коротких раздела: «Обо мне» и «Как мне отвечать», каждый не длиннее 100 слов.

  - id: self-critique
    cat: meta
    title: "Проверь собственный ответ"
    use: "Ответ важен, и вы хотите, чтобы модель прошлась по нему ещё раз."
    text: |-
      Проверь свой предыдущий ответ так, как это сделал бы критически настроенный эксперт.
      Перечисли ошибки, слабые утверждения и упущенные моменты.
      Затем дай исправленную версию и скажи, в каких частях ты всё ещё не уверен.

  - id: chain-planner
    cat: agents
    title: "Спланировать работу как цепочку"
    use: "Задача слишком велика для одного промпта."
    text: |-
      Я хочу сделать вот что: [большая задача].
      Разбей это на четыре–шесть шагов так, чтобы у каждого шага был один понятный результат и он опирался на результат предыдущего.
      Покажи план таблицей: шаг, что на входе, что на выходе, как я это проверю.
      Затем выполни только шаг 1 и жди моего ответа.

  - id: spec-interview
    cat: agents
    title: "Расспроси меня и напиши техзадание"
    use: "Перед тем как агент начнёт делать приложение, скрипт или сайт."
    text: |-
      Я хочу сделать: [идея]. Код пока не пиши.
      Задавай мне вопросы по одному, пока требования не станут ясны, но не больше восьми.
      Затем напиши техзадание на одну страницу: цель, пользователи, функции, что не входит, данные и пять проверок, которые доказывают, что всё работает.
      Дождись моего одобрения и только потом приступай.

  - id: progress-notes
    cat: agents
    title: "Вести заметки о ходе работы"
    use: "Работа, которая продолжится в другой сессии."
    text: |-
      Эта работа продолжится в следующих сессиях.
      Создай progress.md и поддерживай его в актуальном состоянии: сделано, дальше, решения с причинами, открытые проблемы.
      Прежде чем остановиться, обнови файл так, чтобы по нему мог продолжить тот, кто ничего не помнит об этом чате.
      В начале сессии сначала прочитай его и скажи мне, на чём мы остановились.

  - id: hypothesis-research
    cat: agents
    title: "Исследование с гипотезами"
    use: "Нужен надёжный ответ, а не первый найденный."
    text: |-
      Исследуй этот вопрос: [вопрос].
      Перечисли несколько возможных ответов. Для каждого приведи доводы за, доводы против и свою уверенность (низкая, средняя, высокая).
      Проверь ключевые факты минимум по двум независимым источникам и дай ссылки.
      В конце скажи, что остаётся неизвестным.

  - id: daily-briefing
    cat: agents
    title: "Ежедневная сводка"
    use: "Нужно следить за областью, не читая всё подряд."
    text: |-
      Подготовь мне сводку на темы [темы] по источникам [источники] за последние 24 часа.
      Не больше пяти пунктов. Для каждого: краткое изложение в одном предложении, почему это важно для [ваша роль], и ссылка.
      Если ничего важного не произошло, так и скажи и остановись. Не раздувай список.

  - id: scenario-model
    cat: agents
    title: "Модель из трёх сценариев"
    use: "Решение, которое зависит от цифр."
    text: |-
      Мои цифры: [данные или приложенный файл].
      Вопрос: [что вы хотите узнать].
      Построй ожидаемый, лучший и худший сценарии на [период].
      Вынеси все допущения в отдельную таблицу.
      Покажи расчёты для ожидаемого сценария и скажи, какое допущение сильнее всего меняет результат.

  - id: slides-storyline
    cat: agents
    title: "Сюжетная линия для презентации"
    use: "Нужно превратить исследование или заметки в слайды."
    text: |-
      <sources>
      [вставьте материал]
      </sources>

      Аудитория: [кто], время: [минуты].
      Сначала предложи одну главную мысль, которую нужно запомнить. Затем напиши сюжетную линию из [число] слайдов, где каждый заголовок — полное предложение с тезисом слайда.
      Дождись моего одобрения, затем напиши для каждого слайда пункты, источники и заметки докладчика.

  - id: voice-guide
    cat: agents
    title: "Составить руководство по моему голосу"
    use: "Перед тем как писать много текстов в одном стиле."
    text: |-
      <samples>
      [вставьте 3–5 своих реальных текстов]
      </samples>

      Изучи эти образцы и напиши руководство по голосу — не больше десяти правил: длина предложений, характерные слова, начала, концовки и то, чего я никогда не делаю.
      К каждому правилу приведи один пример из образцов. Затем спроси меня, что исправить.

  - id: agent-safety-rules
    cat: agents
    title: "Правила безопасности для агента"
    use: "Вы даёте агенту доступ к своим файлам или аккаунтам."
    text: |-
      Правила для этой задачи:
      Тебе можно свободно: [читать файлы, создавать черновики, запускать тесты].
      Спроси меня перед: [удалением, отправкой, оплатой, публикацией, установкой].
      Делай только то, о чём я попросил. Если заметишь другие проблемы, перечисли их в конце.
      Если что-то не получилось, скажи мне точно, что произошло. Не скрывай этого и не обходи проблему молча.
      В конце дай список всех изменений, которые ты внёс.

  - id: real-fix
    cat: agents
    title: "Исправить причину, а не тест"
    use: "Агент-программист чинит падающие тесты."
    text: |-
      Тесты в [файл] падают.
      Прежде чем отвечать, прочитай код и тесты. Не строй догадок о коде, который ты не открывал.
      Найди настоящую причину и исправь её для всех корректных входных данных, а не только для тех, что есть в тестах.
      Тесты не правь. Если тест выглядит неправильным, остановись и объясни.
      Запусти весь набор тестов и сообщи точный результат.

  - id: system-prompt-builder
    cat: agents
    title: "Собрать системный промпт"
    use: "Вы делаете собственного бота или ассистента."
    text: |-
      Помоги мне написать системный промпт для [назначение бота].
      Расспроси меня: кто пользователи, какие язык и тон, что бот должен знать, чего он никогда не должен делать и почему, и что делать, если он чего-то не знает.
      Затем напиши системный промпт: роль, раздел <knowledge>, правила с причинами и формат ответа.
      В конце дай мне десять тестовых вопросов, в том числе три враждебных или не по теме.

checklist:
  - "Сказал ли я, кто я и что уже знаю?"
  - "Понятна ли задача: цель, аудитория, объём и формат?"
  - "Объяснил ли я не только что нужно, но и зачем?"
  - "Помогут ли один-два примера?"
  - "Отделён ли вставленный материал от инструкций тегами?"
  - "Для сложных задач: попросил ли я рассуждать шаг за шагом и проверить себя?"
  - "Попросил ли я критику, а не согласие?"
  - "Проверю ли я сам факты, цифры и ссылки?"
