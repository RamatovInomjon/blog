      </prompt>

      Nimani istagan edim: [maqsad]. Buning o'rniga nima oldim: [muammo].
      Promptimda nima tushunarsiz yoki nima yetishmayotganini tushuntiring. Keyin yaxshilangan variantini yozing va nimalarni o'zgartirganingizni sanab bering.

  - id: ask-me-first
    cat: meta
    title: "Avval menga savol bering"
    use: "Vazifa katta va nima deb yozishni bilmayotganingizda."
    text: |-
      Menga mana bu ishda yordam berishingizni istayman: [vazifa].
      Boshlashdan oldin, ishni yaxshi bajarish uchun kerakli savollarni menga bering: bittadan, ko'pi bilan beshta.
      Keyin nimani tushunganingizni qisqacha ayting va tasdiqlashimni kuting.

  - id: agent-brief
    cat: meta
    title: "Vazifani agent uchun topshiriqqa aylantirish"
    use: "Ko'p bosqichli ishni AI agentga topshirishdan oldin."
    text: |-
      Mening xomaki iltimosimni AI agent uchun aniq topshiriqqa aylantiring.
      Mana bu sarlavhalardan foydalaning: Maqsad, Tayyor degani, Cheklovlar, Bundan oldin mendan so'rang, Yakuniy hisobot.
      Agar iltimosimda biror sarlavha uchun kerakli ma'lumot yetishmasa, o'ylab topmasdan mendan so'rang.

      Mening iltimosim: [vazifani o'z so'zlaringiz bilan tasvirlang]

  - id: custom-instructions-writer
    cat: meta
    title: "Maxsus ko'rsatmalarimni yozish"
    use: "ChatGPT yoki Claude'ni o'zingizga moslab sozlayotganda."
    text: |-
      Maxsus ko'rsatmalarimni (custom instructions) yozish uchun mendan intervyu oling.
      Quyidagilar haqida so'rang: rolim va darajam, AI'dan nima uchun foydalanishim, javoblar qancha uzunlikda bo'lishini yoqtirishim va AI javoblarida nima g'ashimga tegishi.
      Bittadan savol bering. Keyin ikkita qisqa bo'lim yozing: "Men haqimda" va "Menga qanday javob berish kerak", har biri 100 so'zdan kam bo'lsin.

  - id: self-critique
    cat: meta
    title: "O'z javobingizni tekshiring"
    use: "Javob muhim va uni yana bir bor ko'zdan kechirtirmoqchi bo'lganingizda."
    text: |-
      Oldingi javobingizni tanqidiy ekspert ko'zi bilan ko'rib chiqing.
      Barcha xatolar, asossiz da'volar va tushirib qoldirilgan jihatlarni sanab bering.
      Keyin tuzatilgan variantini bering va qaysi qismlarga hali ham ishonchingiz komil emasligini ayting.

  - id: chain-planner
    cat: agents
    title: "Ishni zanjir qilib rejalashtirish"
    use: "Vazifa bitta prompt uchun juda katta bo'lganda."
    text: |-
      Men mana bu ishni qilmoqchiman: [katta vazifa].
      Uni to'rt-olti qadamga bo'ling: har bir qadamning bitta aniq natijasi bo'lsin va u oldingi qadam natijasidan foydalansin.
      Rejani jadval ko'rinishida ko'rsating: qadam, kirish, natija, uni qanday tekshiraman.
      Keyin faqat 1-qadamni bajaring va javobimni kuting.

  - id: spec-interview
    cat: agents
    title: "Mendan so'rab, spetsifikatsiya yozish"
    use: "Agent ilova, skript yoki sayt yasashidan oldin."
    text: |-
      Men mana buni yasamoqchiman: [g'oya]. Hozircha kod yozmang.
      Talablar aniq bo'lguncha menga bittadan savol bering, ko'pi bilan sakkizta.
      Keyin bir sahifali spetsifikatsiya yozing: maqsad, foydalanuvchilar, funksiyalar, doiradan tashqaridagi narsalar, ma'lumotlar va ishlayotganini isbotlaydigan beshta tekshiruv.
      Yasashni boshlashdan oldin ma'qullashimni kuting.

  - id: progress-notes
    cat: agents
    title: "Ish jarayonini qayd qilib borish"
    use: "Ish boshqa sessiyada davom etadigan bo'lganda."
    text: |-
      Bu ish keyingi sessiyalarda davom etadi.
      progress.md faylini yarating va uni yangilab boring: bajarildi, navbatda, qarorlar va sabablari, ochiq muammolar.
      To'xtashdan oldin faylni shunday yangilangki, bu chatdan mutlaqo bexabar odam ham ishni shu fayl bo'yicha davom ettira olsin.
      Sessiya boshida avval uni o'qing va qayerda turganimizni ayting.

  - id: hypothesis-research
    cat: agents
    title: "Farazlar bilan tadqiq qilish"
    use: "Birinchi topilgan emas, ishonchli javob kerak bo'lganda."
    text: |-
      Mana bu savolni tadqiq qiling: [savol].
      Bir nechta ehtimoliy javobni sanab bering. Har biri uchun tasdiqlovchi dalillarni, qarshi dalillarni va ishonch darajangizni (past, o'rta, yuqori) ko'rsating.
      Asosiy faktlarni kamida ikkita mustaqil manbada tekshiring va havolalarni bering.
      Oxirida nima hali noma'lumligini yozing.

  - id: daily-briefing
    cat: agents
    title: "Kundalik brifing"
    use: "Sohani hamma narsani o'qimasdan kuzatib borish uchun."
    text: |-
      [manbalar] asosida [mavzular] bo'yicha so'nggi 24 soatni qamraydigan brifingimni tayyorlang.
      Ko'pi bilan beshta band. Har biri uchun: bir gapli xulosa, [sizning rolingiz] uchun nega muhimligi va havola.
      Muhim hech narsa bo'lmagan bo'lsa, shuni ayting va to'xtang. Ro'yxatni sun'iy to'ldirmang.

  - id: scenario-model
    cat: agents
    title: "Uch ssenariyli model"
    use: "Qaror raqamlarga bog'liq bo'lganda."
    text: |-
      Mening raqamlarim: [ko'rsatkichlar yoki ilova qilingan fayl].
      Savol: [nimani bilmoqchisiz].
      [davr] uchun kutilayotgan, yaxshiroq va yomonroq ssenariylarni tuzing.
      Har bir taxminni alohida jadvalga joylang.
      Kutilayotgan holat uchun hisob-kitobni ko'rsating va qaysi taxmin natijani eng ko'p o'zgartirishini ayting.

  - id: slides-storyline
    cat: agents
    title: "Taqdimot uchun hikoya chizig'i"
    use: "Tadqiqot yoki qaydlarni slaydlarga aylantirishda."
    text: |-
      <sources>
      [materialni shu yerga qo'ying]
      </sources>

      Auditoriya: [kim], vaqt: [daqiqa].
      Avval eslab qolinishi kerak bo'lgan bitta asosiy fikrni taklif qiling. Keyin [son] slayddan iborat hikoya chizig'ini yozing, har bir sarlavha fikrni ifodalaydigan to'liq gap bo'lsin.
      Ma'qullashimni kuting, so'ng har bir slayd uchun bandlar, manbalar va ma'ruzachi qaydlarini yozing.

  - id: voice-guide
    cat: agents
    title: "Ovoz qo'llanmamni tuzish"
    use: "Bir uslubda ko'p matn tayyorlashdan oldin."
    text: |-
      <samples>
      [haqiqiy matnlaringizdan 3–5 tasini shu yerga qo'ying]
      </samples>

      Shu namunalarni o'rganib chiqing va ko'pi bilan o'nta qoidadan iborat ovoz qo'llanmasini yozing: gap uzunligi, o'ziga xos so'zlar, boshlanishlar, yakunlar va men hech qachon nima qilmasligim.
      Har bir qoida uchun namunalardan bitta misol keltiring. Keyin nimani tuzatish kerakligini mendan so'rang.

  - id: agent-safety-rules
    cat: agents
    title: "Agent uchun xavfsizlik qoidalari"
    use: "Agentga fayllaringiz yoki akkauntlaringizga kirish huquqini berayotganda."
    text: |-
      Bu vazifa uchun qoidalar:
      Erkin bajarishingiz mumkin: [fayllarni o'qish, qoralamalar yaratish, testlarni ishga tushirish].
      Bundan oldin mendan so'rang: [o'chirish, yuborish, to'lash, e'lon qilish, o'rnatish].
      Faqat men so'ragan ishni bajaring. Boshqa muammolarni payqasangiz, ularni oxirida sanab bering.
      Biror narsa amalga oshmasa, aynan nima bo'lganini menga ayting. Buni yashirmang va indamasdan aylanib o'tmang.
      Yakunda kiritgan har bir o'zgarishingiz ro'yxatini bering.

  - id: real-fix
    cat: agents
    title: "Testni emas, sababni tuzatish"
    use: "Dasturlash agenti o'tmayotgan testlarni tuzatayotganda."
    text: |-
      [fayl]dagi testlar o'tmayapti.
      Javob berishdan oldin kodni va testlarni o'qib chiqing. Ochib ko'rmagan kodingiz haqida taxmin qilmang.
      Haqiqiy sababni toping va uni faqat testda tekshirilganlari uchun emas, barcha to'g'ri kirish ma'lumotlari uchun tuzating.
      Testlarni tahrirlamang. Agar biror test noto'g'ri ko'rinsa, to'xtang va tushuntiring.
      Barcha testlarni to'liq ishga tushiring va natijani aynan o'zidek xabar qiling.

  - id: system-prompt-builder
    cat: agents
    title: "Tizim promptini tuzish"
    use: "O'z botingiz yoki yordamchingizni yasayotganda."
    text: |-
      [botning vazifasi] uchun tizim promptini yozishimga yordam bering.
      Mendan quyidagilar haqida so'rang: foydalanuvchilar, til va ohang, bot nimalarni bilishi shart, nimani hech qachon qilmasligi kerak va nega, javobni bilmaganda nima qilishi kerak.
      Keyin tizim promptini yozing: unda rol, <knowledge> bo'limi, sabablari ko'rsatilgan qoidalar va javob formati bo'lsin.
      Oxirida menga o'nta sinov savolini bering, shulardan uchtasi g'arazli yoki mavzuga aloqasiz bo'lsin.

checklist:
  - "Kim ekanimni va nimani allaqachon bilishimni aytdimmi?"
  - "Vazifa aniqmi: maqsad, o'quvchi, hajm va format?"
  - "Faqat nima kerakligini emas, nima uchun kerakligini ham tushuntirdimmi?"
  - "Bir-ikkita misol yordam berarmidi?"
  - "Qo'yilgan material ko'rsatmalardan teglar bilan ajratilganmi?"
  - "Qiyin masalalarda: qadam-baqadam mulohaza va o'zini tekshirishni so'radimmi?"
  - "Ma'qullash o'rniga tanqid so'radimmi?"
  - "Faktlar, raqamlar va manbalarni o'zim tekshiramanmi?"
