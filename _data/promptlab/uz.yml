      1. 10 yoshli bolaga, uch gapda.
      2. Yuqori sinf o'quvchisiga, kundalik hayotdan bitta misol bilan.
      3. 1-kurs talabasiga, to'g'ri atamalar bilan.
      Keyin hamma narsadan oldin tushunib olishim shart bo'lgan bitta g'oyani ayting.

