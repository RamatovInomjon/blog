    why: "Uchta ssenariy bitta soxta aniq raqam o'rniga oraliqni ko'rsatadi, ko'rinib turgan taxminlarni esa shubha ostiga olish va o'zgartirish mumkin."
    check:
      q: "Nega taxminlarni alohida jadvalda so'rash kerak?"
      options:
        - "Natija nimaga bog'liq ekanini ko'rish va o'zgartira olish uchun."
        - "Javob professionalroq ko'rinishi uchun."
      answer: 0
      explain: "Prognoz o'z taxminlari qanchalik to'g'ri bo'lsa, shunchalik yaxshi. Ularni qo'l yetadigan joyda saqlang."
    keep: |-
