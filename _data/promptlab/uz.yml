    idea: "Yaxshi taqdimot — faktlar uyumi emas, balki dalillangan fikr. Uni tartib bilan quring: avval yagona asosiy fikr, keyin har bir slaydda bitta fikr bo'lgan hikoya chizig'i, undan so'ng har biri manbalaringizdagi dalillarga tayangan slaydlar. Birorta slayd yozilmasidan oldin hikoyani belgilab oling."
