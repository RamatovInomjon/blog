  - id: numbers-and-scenarios
    module: advanced
    title: "Raqamlarni ssenariylar bilan tahlil qiling"
    idea: "Raqamlar ishtirok etgan har qanday savolda haqiqiy ko'rsatkichlarni bering va bittadan ortiq javob so'rang: kutilayotgan, yaxshiroq va yomonroq holat, har bir taxmin esa alohida sanab o'tilsin. Keyin hisob-kitobni ko'rsatishini so'rang va bitta qatorni qo'lda tekshirib ko'ring."
