      Menga bittadan savol bering: osonidan boshlab, asta-sekin qiyinlashtirib boring.
      Har bir javobimdan keyin to'g'ri yoki noto'g'riligini ayting, qisqacha tushuntiring va keyingi savolni bering.
      O'nta savoldan keyin takrorlashim kerak bo'lgan mavzularni sanab bering.

