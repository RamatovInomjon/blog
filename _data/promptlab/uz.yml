  - id: stay-in-control
    module: advanced
    title: "Agentingizni nazoratda tuting"
    idea: "Vositalarga ega agent fayllarni o'chirishi, xabar yuborishi va pul sarflashi mumkin. Qaysi amallarni erkin bajarishi mumkinligini, qaysilari uchun esa sizning ruxsatingiz kerakligini ayting. Oddiy qoida yaxshi ishlaydi: ortga qaytarsa bo'ladigan har qanday amalga ruxsat, ortga qaytarib bo'lmaydigan yoki boshqa odamlar ko'radigan amaldan oldin esa avval so'rash kerak. Undan faqat so'ralgan ishni bajarishni so'rang."
    weak: "Loyiha papkamni tozalab ber."
    better: |-
      Loyiha papkasini tartibga keltiring.
      Erkin bajarishingiz mumkin: istalgan faylni o'qish, yangi papkalar yaratish va fayllarni loyiha ichida ko'chirish.
      Bundan oldin mendan so'rang: biror narsani o'chirish, git kuzatayotgan fayllarni o'zgartirish yoki biror narsa o'rnatish.
      Faqat men so'ragan ishni bajaring. Boshqa muammolarni payqasangiz, ularni tuzatmasdan, oxirida sanab bering.
      Yakunda kiritgan har bir o'zgarishingiz ro'yxatini bering.
    why: "Agent xavfsiz amallarni tez bajaradi, xavflilari esa har doim siz orqali o'tadi."
    check:
      q: "Agent qaysi amal haqida har doim avval so'rashi kerak?"
      options:
        - "Faylni o'qish."
        - "Fayllarni o'chirish yoki boshqa odamlarga xabar yuborish."
      answer: 1
      explain: "Ortga qaytarib bo'lmaydigan va boshqa odamlar ko'radigan amallar uchun sizning ruxsatingiz kerak."
    keep: |-
      Erkin bajarishingiz mumkin: [xavfsiz, ortga qaytarsa bo'ladigan amallar]
      Bundan oldin mendan so'rang: [o'chirish, yuborish, to'lash, e'lon qilish, o'rnatish]
      Faqat men so'ragan ishni bajaring. Payqagan boshqa muammolaringizni sanab bering, lekin tuzatmang.
      Oxirida kiritgan har bir o'zgarishingizni sanab bering.

  - id: honest-code
    module: advanced
    title: "Testdan o'tadigan emas, haqiqiy yechim so'rang"
    idea: "\"Testlar o'tsin\" deyilgan dasturlash agenti aynan shuni qilib, undan ortig'ini qilmasligi mumkin, masalan, faqat testda tekshirilgan kirish ma'lumotlarini hisobga oladi. Barcha to'g'ri kirish ma'lumotlarida ishlaydigan yechim so'rang, kod haqida biror narsa deyishdan oldin uni o'qib chiqishini ayting va testning o'zi noto'g'ri ko'rinsa, buni sizga aytishini so'rang."
    weak: "Testlar o'tmayapti. O'tadigan qil."
    better: |-
      test_parser.py faylidagi uchta test o'tmayapti.
      Javob berishdan oldin parser kodini va testlarni o'qib chiqing. Ochib ko'rmagan kodingiz haqida taxmin qilmang.
      Haqiqiy sababni toping va uni shunday tuzatingki, parser faqat testda tekshirilganlarida emas, barcha to'g'ri kirish ma'lumotlarida ishlasin.
      Testlar o'tishi uchun ularning o'zini tahrirlamang. Agar biror test noto'g'ri ko'rinsa, to'xtang va sababini tushuntiring.
      Keyin barcha testlarni to'liq ishga tushiring va natijani aynan o'zidek, o'tmagan testlar bilan birga xabar qiling.
    why: "Maqsad to'g'ri ishlash sifatida ifodalangan, shuning uchun faqat testlarni qanoatlantiradigan oson yo'llarga o'rin qolmaydi."
    check:
      q: "Agent \"hammasi tuzatildi\" dedi, lekin siz testlar ishga tushirilganini ko'rmadingiz. Nima deb so'raysiz?"
      options:
        - "\"Testlarni ishga tushiring va natijasini ko'rsating.\""
        - "Hech narsa. Tuzatildi dedimi, demak tuzatilgan."
      answer: 0
      explain: "Dalil so'rang. \"Bajarildi\" degan gap test natijasi emas."
    keep: |-
      Javob berishdan oldin tegishli kodni o'qib chiqing. Taxmin qilmang.
      Haqiqiy sababni shunday tuzatingki, kod faqat testda tekshirilganlarida emas, barcha to'g'ri kirish ma'lumotlarida ishlasin.
      Testlarni o'zgartirmang. Agar biror test noto'g'ri ko'rinsa, menga ayting.
      Testlarni ishga tushiring va natijani aynan o'zidek xabar qiling.

  - id: system-prompt
    module: advanced
    title: "O'z botingiz uchun tizim promptini yozing"
    idea: "Model ustiga bot yoki ilova qurayotganingizda tizim prompti (system prompt) uning lavozim yo'riqnomasi bo'ladi. Unda rolni, foydalanuvchilarni, bot nimalarni bilishi shartligini, qoidalarni sabablari bilan, javob formatini va javobni bilmaganda nima qilishini tasvirlang. Keyin uni haqiqiy savollarda, jumladan, g'arazli va mavzuga aloqasiz savollarda sinab ko'ring."
    weak: "Sen do'konim uchun foydali yordamchisan."
    better: |-
      Siz Toshkentdagi onlayn kitob do'konining mijozlarni qo'llab-quvvatlash yordamchisisiz. Mijozlar o'zbek yoki rus tilida yozadi; ularning xabari qaysi tilda bo'lsa, shu tilda javob bering.

      <knowledge>
      [yetkazib berish shartlari, narxlar, qaytarish qoidalari]
      </knowledge>

      Qoidalar:
      - Faqat yuqoridagi ma'lumotlarga tayanib javob bering. Agar javob u yerda bo'lmasa, savolni xodimga yetkazishingizni ayting, chunki narxlar haqidagi noto'g'ri javob bizni mijozlardan ayiradi.
      - Javoblar to'rt gapdan oshmasin, chunki mijozlar ularni telefonda o'qiydi.
      - Hech qachon karta raqamini so'ramang, chunki to'lov faqat saytda amalga oshiriladi.
    why: "Bot o'z rolini, chegaralarini va har bir qoidaning sababini biladi, shuning uchun siz sanab o'tmagan holatlarda ham oqilona yo'l tutadi."
    check:
      q: "Tizim promptini yozib bo'lgach, nima qilish kerak?"
      options:
        - "Uni haqiqiy, qiyin va mavzuga aloqasiz savollarda sinab ko'rish."
        - "Uni darhol ishga tushirib yuborish."
      answer: 0
      explain: "Tizim prompti qiyin holatlarda sinab ko'rilmaguncha qoralama bo'lib qoladi."
    keep: |-
      Siz [foydalanuvchilar] uchun [rol]siz. [Til va ohang.]

      <knowledge>
      [bot tayanishi mumkin bo'lgan faktlar]
      </knowledge>

      Qoidalar:
      - [qoida], chunki [sabab].
      - Agar javobni bilmasangiz, [nima qilish kerak].
      Format: [javoblarning hajmi va tuzilishi]

prompts:
