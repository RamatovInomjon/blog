      Har bir qadamdan keyin ishlab turgan kodni commit qiling.
      Har bir sessiya boshida progress.md faylini va so'nggi commit'lar tarixini o'qing, qayerda turganimizni uch qatorda ayting, so'ng davom eting.
    why: "Xotirani fayllar saqlaydi, shuning uchun hech narsa chat tarixi saqlanib qolishiga bog'liq emas."
    check:
      q: "Yangi sessiya boshlandi. Agent birinchi navbatda nima qilishi kerak?"
      options:
        - "Bajarilgan ishlar haqidagi qaydlarni va so'nggi o'zgarishlarni o'qishi."
        - "Ehtiyot shart hammasini boshidan boshlashi."
      answer: 0
      explain: "Yozib qo'yilgan holat ishni aynan to'xtagan joyidan davom ettirish imkonini beradi."
    keep: |-
      Ish jarayoni yoziladigan fayl yuriting va uni har bir qadamdan keyin yangilang:
      - Bajarildi: [tugallangan qadamlar]
      - Navbatda: [keyingi qadam]
      - Qarorlar: [nima qaror qilindi va nega]
      - Muammolar: [ochiq masalalar]
      Har bir sessiya boshida avval shu faylni o'qing va qayerda turganimizni qisqacha ayting.

  - id: research-hypotheses
    module: advanced
    title: "Raqobatlashuvchi farazlar bilan tadqiq qiling"
    idea: "Biror savolni o'rganish so'ralganda, model odatda birinchi ishonarli javobni topib, shu yerda to'xtaydi. Undan bir vaqtning o'zida bir nechta ehtimoliy izohni ko'rib chiqishni, har biri uchun ham tasdiqlovchi, ham inkor etuvchi dalil izlashni, qanchalik ishonchi borligini aytishni va muhim da'volarni bittadan ortiq manbada tekshirishni so'rang."
    weak: "O'tgan oy ilovamiz foydalanuvchilari soni nega kamayib ketdi?"
    better: |-
      O'tgan oy ilovamizning kunlik foydalanuvchilari 20% ga kamaydi. Ma'lumotlar ilova qilingan.
      Kamida to'rtta ehtimoliy izohni sanab bering.
      Har biri uchun: ma'lumotlardagi qanday dalil uni tasdiqlagan bo'lardi, qandayi inkor etgan bo'lardi va amalda nimani topdingiz.
      Har biriga ishonch darajasini (past, o'rta, yuqori) qo'ying va qanday qo'shimcha ma'lumot masalani hal qilishini ayting.
      Dalillar aniq bo'lmasa, g'olibni tanlamang.
    why: "Bir nechta faraz modelni birinchi uchragan talqinga yopishib olishdan saqlaydi, ishonch darajalari esa javobning qayeri zaif ekanini ko'rsatadi."
    check:
      q: "Nega har bir izohga qarshi dalillarni ham so'rash kerak?"
      options:
        - "Bu modelni faqat birinchi kelgan fikrini tasdiqlashdan to'xtatadi."
        - "Javob uzunroq va ta'sirchanroq chiqadi."
      answer: 0
      explain: "Inkor etuvchi dalillarni izlash — halol tadqiqotning o'zagi."
    keep: |-
      Savol: [nimani aniqlamoqchisiz]
      1. Bir nechta ehtimoliy javob yoki izohni sanab bering.
      2. Har biri uchun: tasdiqlovchi dalillar, qarshi dalillar, ishonch darajasi (past / o'rta / yuqori).
      3. Asosiy faktlarni kamida ikkita mustaqil manbada tekshiring va manbalarni ko'rsating.
      4. Nima hali noma'lumligini va uni nima hal qilishini ayting.

  - id: recurring-job
    module: advanced
    title: "Takrorlanadigan vazifani qayta ishlatiladigan ishga aylantiring"
    idea: "Agar har kuni yoki har hafta bir xil narsani so'rasangiz, uni bir marta ish sifatida yozib qo'ying: o'zgarmas manbalar, o'zgarmas format, nima xabar berishga arzishini belgilaydigan qoida va hech narsa o'zgarmaganini aytishga ruxsat. Avval uni qo'lda ishga tushirib ko'ring, natija to'g'ri chiqqach esa jadval bo'yicha ishlaydigan qilib qo'ying."
