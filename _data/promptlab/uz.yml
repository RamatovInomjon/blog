# Prompt Lab kontenti — o'zbekcha (en.yml faylining tarjimasi).
# Bu fayl en.yml ni kalitma-kalit takrorlaydi; id, `cat` va `answer` qiymatlari bir xil bo'lishi shart.

ui:
  title: "Prompt Lab"
  tagline: "ChatGPT va Claude bilan endi tanishayotgan talabalar va dasturchilar uchun qisqa, bepul kurs va promptlar kutubxonasi."
  author: "Muallif: Inomjon Ramatov"
  nav_course: "Kurs"
  nav_library: "Promptlar kutubxonasi"
  nav_checklist: "Tekshiruv ro'yxati"
  course_title: "Kurs: 26 ta qisqa dars"
  course_intro: "Har bir dars taxminan uch daqiqa oladi: bitta g'oya, kuchsiz va yaxshiroq prompt, kichik savol hamda o'zingizda qoladigan shablon."
  idea: "G'oya"
  weak: "Kuchsiz prompt"
  better: "Yaxshiroq prompt"
  why: "Nega bu ishlaydi"
  check: "O'zingizni tekshiring"
  keep: "Shablonni saqlab qo'ying"
  copy: "Nusxalash"
  copied: "Nusxalandi"
  correct: "To'g'ri."
  wrong: "Unchalik emas."
  done: "Bajarildi"
  progress: "dars o'tildi"
  library_title: "Promptlar kutubxonasi"
  library_intro: "Tayyor promptlar. [Kvadrat qavs] ichidagi qismlarni o'z ma'lumotlaringiz bilan almashtiring."
  search: "Promptlarni qidirish"
  all: "Hammasi"
  when: "Qachon ishlatiladi"
  empty: "Qidiruvingizga mos prompt topilmadi."
  checklist_title: "Enter tugmasini bosishdan oldin"
  checklist_intro: "Muhim bo'lgan har qanday promptni shu ro'yxat bo'yicha tekshirib chiqing."
  sources_title: "Manbalar va qo'shimcha o'qish uchun"
  sources_intro: "Darslar shu sayt uchun maxsus yozilgan. G'oyalar esa rasmiy prompt yozish qo'llanmalariga tayanadi:"
  placeholder_note: "[Kvadrat qavs] ichidagi matn — o'rniga o'zingiznikini yozadigan joy."

modules:
  basics: "1-qism · Asoslar"
  thinking: "2-qism · Yaxshiroq javoblar"
  agents: "3-qism · Agentlar va kod"
  advanced: "4-qism · Ilg'or daraja: agentlar bilan ishlash"

cats:
  study: "O'qish"
  coding: "Dasturlash"
  writing: "Yozish"
  research: "Tadqiqot"
  career: "Karyera"
  meta: "Prompt yozish"
  agents: "Agentlar"

lessons:
  - id: what-is-a-prompt
    module: basics
    title: "Prompt aslida nima"
    idea: "Prompt qidiruv so'rovi emas, balki ishni tushuntirib berishdir. Tasavvur qiling: yoningizda juda qobiliyatli yangi hamkasb bor, lekin u sizning kursingizni ham, kodingizni ham, o'qituvchingizni ham ko'rmagan. U ko'p narsani biladi, ammo sizning vaziyatingizdan bexabar. Siz aytmagan narsani u taxmin qilishga majbur."
    weak: "Rekursiyani tushuntir."
    better: |-
      Men 1-kurs talabasiman. Python'da sikl va funksiyalarni bilaman, lekin rekursiyani hali ko'rmaganman.
      Rekursiyani sodda so'zlar bilan tushuntiring, keyin Python'da bitta qisqa misol (faktorial) ko'rsating va har bir chaqiruvda nima sodir bo'lishini qadam-baqadam ko'rsatib bering.
      Oxirida o'zim sinab ko'rishim uchun ikkita kichik mashq bering.
    why: "Ikkinchi promptda kim so'rayotgani, u nimani bilishi va yaxshi javob qanday bo'lishi aytilgan. Taxmin qilishga hech narsa qolmagan."
    check:
      q: "Sizga noaniq, umumiy javob keldi. Eng ehtimolli sabab nima?"
      options:
        - "Promptda vaziyat aytilmagan, shuning uchun model taxmin qilishga majbur bo'lgan."
        - "Model bu mavzu uchun yetarlicha aqlli emas."
      answer: 0
      explain: "Umumiy javoblar deyarli har doim kontekst yetishmasligidan kelib chiqadi."
    keep: |-
      Men [kimsiz va nimani allaqachon bilasiz].
      Menga [nima kerak] kerak, chunki [undan qanday foydalanasiz].
      Yaxshi javob shunday bo'ladi: [format, hajm, daraja].

  - id: be-specific
    module: basics
    title: "Aniq va tushunarli yozing"
    idea: "Nima istayotganingizni aniq ayting: maqsad, o'quvchi, hajm va format. Foydali sinov: promptingizni vazifadan mutlaqo bexabar do'stingizga ko'rsating. Agar u savol berishga majbur bo'lsa, model ham xuddi shu ahvolga tushadi."
    weak: "Iqlim o'zgarishi haqida yoz."
    better: |-
      Iqlim o'zgarishi Markaziy Osiyoda suv ta'minotiga qanday ta'sir qilishi haqidagi maktab inshosi uchun 300 so'zli kirish qismini yozing.
      O'quvchi: geografiya o'qituvchim. Ohang: rasmiy, lekin sodda.
      Keyinroq o'zim tekshirib ko'rishim kerak bo'lgan ikkita aniq faktni qo'shing va ularni [TEKSHIRISH] deb belgilang.
    why: "Mavzu, hajm, o'quvchi va ohang oldindan belgilangan, shuning uchun javob beshinchi urinishda emas, birinchisidayoq mos keladi."
    check:
      q: "Qaysi qo'shimcha ko'proq yordam beradi?"
      options:
        - "\"Yaxshi va qiziqarli qilib yoz.\""
        - "\"300 so'z, o'qituvchim uchun, rasmiy ohangda, bitta xatboshi qilib.\""
      answer: 1
      explain: "\"Yaxshi\" degan so'z modelga hech narsa bermaydi. Hajm, o'quvchi va format esa beradi."
    keep: |-
      Vazifa: [nima tayyorlash kerak]
      O'quvchi: [kim o'qiydi]
      Hajm: [so'zlar / xatboshilar / bandlar soni]
      Format: [xatboshi, ro'yxat, jadval, kod]
      Ohang: [rasmiy, do'stona, sodda]

  - id: explain-why
    module: basics
    title: "Qoidaning sababini tushuntiring"
    idea: "Quruq qoida so'zma-so'z bajariladi. Sababi aytilgan qoida esa tushuniladi va model uni siz tilga olmagan holatlarda ham o'rinli qo'llaydi."
    weak: "Qiyin so'zlarni ishlatma."
    better: "O'quvchilarim ingliz tilini ikkinchi til sifatida o'rganayotgan 12 yoshli bolalar. Shuning uchun qisqa gaplar va kundalik so'zlardan foydalaning, har bir atamani esa birinchi uchraganida tushuntirib o'ting."
    why: "O'quvchi kimligini bilgan model faqat siz aytgan narsani emas, ko'plab mayda tanlovlarni ham to'g'ri qiladi."
    check:
      q: "Ko'rsatmaga sababini qo'shish nega kerak?"
      options:
        - "Prompt xushmuomalaroq ko'rinadi."
        - "Model sababga tayanib, siz sanab o'tmagan vaziyatlarda ham to'g'ri yo'l tutadi."
      answer: 1
      explain: "Sabab qoidaning o'zidan ancha ko'p ma'lumot beradi."
    keep: |-
      [Ko'rsatma], chunki [sabab: kim o'qiydi, qayerda ishlatiladi, aks holda nima xato ketadi].

  - id: show-examples
    module: basics
    title: "Misol ko'rsating"
    idea: "Bir-ikkita misol format va ohangni uzun tavsifdan ko'ra yaxshiroq yo'naltiradi. Imkon bo'lsa, uch-beshta misol bering, ular bir-biridan farq qilsin va ko'rsatmalaringizdan aniq ajratilgan bo'lsin."
    weak: "Mana bu biologiya konspektidan fleshkartalar yoz."
    better: |-
      Biologiya konspektimni aynan mana shu uslubdagi fleshkartalarga aylantiring:

      <example>
      S: Mitoxondriya qanday vazifani bajaradi?
      J: Hujayra energiyasining (ATF) asosiy qismini ishlab chiqaradi.
      </example>
      <example>
      S: Fotosintez qayerda sodir bo'ladi?
      J: O'simlik hujayralarining xloroplastlarida.
      </example>

      Konspekt:
      [konspektni shu yerga qo'ying]
    why: "Model andozani takrorlaydi: bitta qisqa savol, bitta qisqa javob va har safar bir xil ko'rinish."
    check:
      q: "Misollaringizning hammasi deyarli bir xil. Bunda qanday xavf bor?"
      options:
        - "Model siz ko'zda tutmagan tafsilotlarni ham ko'chiradi, masalan, bir xil mavzu yoki hajmni."
        - "Hech qanday xavf yo'q, bir xil misollar eng yaxshisi."
      answer: 0
      explain: "Misollarni turlicha qiling, shunda faqat o'zingizga kerakli andoza takrorlanadi."
    keep: |-
      [Vazifa]. Quyidagi misollar uslubiga amal qiling.

      <example>
      [1-misol]
      </example>
      <example>
      [2-misol, birinchisidan farq qiladigan]
      </example>

      Endi xuddi shu ishni mana bu uchun bajaring:
      [o'z matningiz]

  - id: use-tags
    module: basics
    title: "Qismlarni teglar bilan ajrating"
    idea: "Promptda ko'rsatmalar, kontekst va tashqaridan qo'yilgan material aralashib ketsa, har bir qismni <instructions> yoki <text> kabi oddiy tegga o'rang. Shunda model sizning iltimosingizni siz qo'ygan material bilan adashtirmaydi."
    weak: "Buni qisqacha aytib ber va qisqaroq qil va xatolarini tuzat mana kecha yozgan matnim u ... haqida"
    better: |-
      <instructions>
      1. Grammatik va imlo xatolarini tuzating.
      2. Keyin uch gapdan iborat xulosa bering.
      Fikrimning ma'nosini o'zgartirmang.
      </instructions>

      <text>
      [matningizni shu yerga qo'ying]
      </text>
    why: "Ko'rsatmalar va material bir-biridan yaqqol ajralib turadi, raqamlangan qadamlar esa tartib bilan bajariladi."
    check:
      q: "Teg nomlari maxsus kalit so'zlar bo'lishi shartmi?"
      options:
        - "Yo'q. Har qanday tushunarli va izchil nom bo'laveradi."
        - "Ha. Model faqat rasmiy teglarni tushunadi."
      answer: 0
      explain: "Teglar shunchaki yorliq. Mazmunni ifodalaydigan nom tanlang va uni bir xilda ishlating."
    keep: |-
      <context>
      [modelga kerak bo'ladigan ma'lumot]
      </context>

      <instructions>
      [raqamlangan qadamlar]
      </instructions>

      <input>
      [ishlov beriladigan material]
      </input>

  - id: give-a-role
    module: basics
    title: "Modelga rol bering"
    idea: "Model kim bo'lishi kerakligi haqidagi bitta gap uning bilimi va ohangini bir nuqtaga jamlaydi. Aniq rol dabdabali roldan yaxshiroq ishlaydi."
    weak: "Kodimni tekshir."
    better: |-
      Siz tajribali (senior) Python dasturchisisiz va boshlovchi (junior) hamkasbingizning pull request'ini ko'rib chiqyapsiz.
      Quyidagi kodni xatolar, tushunarsiz nomlar va hisobga olinmagan chekka holatlar bo'yicha tekshiring.
      Ochiq, lekin xayrixohlik bilan yozing va har bir muammoni bir-ikki gapda tushuntiring.

      [kodni shu yerga qo'ying]
    why: "Rol bir qatorning o'zida ham talab darajasini (tajribali dasturchi tekshiruvi), ham ohangni (ochiq, lekin xayrixoh) belgilab beradi."
    check:
      q: "Qaysi rol foydaliroq?"
      options:
        - "\"Sen dunyodagi eng buyuk dahosan.\""
        - "\"Siz talabani universitetga kirish imtihoniga tayyorlayotgan fizika repetitorisiz.\""
      answer: 1
      explain: "Aniq rol modelga daraja, maqsad va o'quvchi kimligini bildiradi."
    keep: |-
      Siz [aniq rol]siz va [kimga] [nimada] yordam beryapsiz.
      [Vazifa]

  - id: control-format
    module: basics
    title: "Formatni o'zingiz belgilang"
    idea: "Nimani istamasligingizni sanash o'rniga, qanday natija kerakligini tasvirlang. \"Ikkita qisqa xatboshida javob bering\" degan gap \"ko'p yozma, ro'yxat kerak emas\" deganidan yaxshiroq ishlaydi."
    weak: "Python bilan JavaScript'ni solishtir. Uzun matn yozma, ro'yxat ishlatma."
    better: |-
      Birinchi dasturlash tilini tanlayotgan boshlovchi uchun Python va JavaScript'ni solishtiring.
      Javobni uch ustunli jadval ko'rinishida bering: Mezon, Python, JavaScript.
      Besh qator bo'lsin: o'rganish qiyinligi, odatda qayerda ishlatiladi, mehnat bozori, kerakli vositalar, birinchi loyiha g'oyasi.
      Jadvaldan keyin ikki gapda o'z tavsiyangizni bering.
    why: "Format ijobiy tasvirlanganda modelning oldida bitta aniq nishon qoladi."
    check:
      q: "Sizga oddiy xatboshilar kerak. Qaysi ko'rsatma yaxshiroq ishlaydi?"
      options:
        - "\"To'liq gaplardan iborat ravon xatboshilar bilan yozing.\""
        - "\"Markdown ishlatmang.\""
      answer: 0
      explain: "Modelga nima qilish kerakligini ayting. Bu nimadan qochishni aytishdan ko'ra tushunarliroq."
    keep: |-
      Javobni [jadval / raqamlangan ro'yxat / N ta xatboshi / JSON] ko'rinishida bering.
      Aynan shular bo'lsin: [qismlar yoki ustunlar].
      Hajmi [hajm]dan oshmasin.

  - id: let-it-think
    module: thinking
    title: "Avval o'ylab olishiga imkon bering"
    idea: "Matematika, mantiq, rejalashtirish yoki har qanday ko'p bosqichli masalada modeldan yakuniy javobni berishdan oldin qadam-baqadam mulohaza yuritishni, so'ng o'z ishini tekshirib chiqishni so'rang. Avval mulohaza yuritilsa, xatolar ko'zga tashlanadi va kamayadi."
    weak: "Poyezd 14:20 da jo'nab, 7 daqiqalik ikkita to'xtash bilan 17:05 da yetib keldi. U qancha vaqt yurgan? Faqat javobini ayt."
    better: |-
      Poyezd 14:20 da jo'nab, 17:05 da yetib keldi. Yo'lda har biri 7 daqiqadan ikki marta to'xtadi. U aslida qancha vaqt harakatda bo'lgan?
      Masalani qadam-baqadam yechib chiqing, keyin yakuniy javobni alohida qatorda yozing.
      Tugatishdan oldin hisob-kitobni yana bir bor tekshiring.
    why: "Har bir qadamni kuzatib borishingiz mumkin, o'zini tekshirish esa xatolarni sizga yetib kelmasidan ushlaydi."
    check:
      q: "Qadam-baqadam mulohazani qachon so'rash arziydi?"
      options:
        - "Oddiy faktlar uchun, masalan, poytaxt nomi."
        - "Bir necha bosqichli masalalar uchun, masalan, hisob-kitob yoki reja."
      answer: 1
      explain: "Oddiy ma'lumot so'rashda bunga hojat yo'q. Ko'p bosqichli masalalarda esa kerak."
    keep: |-
      [Masala]
      Buni qadam-baqadam o'ylab chiqing.
      Keyin yakuniy javobni alohida qatorda yozing.
      Tugatishdan oldin natijangizni tekshiring.

  - id: ask-for-disagreement
    module: thinking
    title: "E'tiroz bildirishini so'rang"
    idea: "Modellar siz ishonayotgandek ko'ringan fikrga qo'shilishga moyil. \"G'oyam yaxshimi?\" deb so'rasangiz, odatda \"ha\" degan javobni eshitasiz. Buning o'rniga eng kuchli tanqidni so'rang va qaysi variant sizga yoqishini oshkor qilmang."
    weak: "Menimcha, startap g'oyam zo'r. Sen ham shunday deb o'ylaysanmi?"
    better: |-
      Mana bir startap g'oyasi: [g'oyani o'zingizniki ekanini aytmasdan tasvirlang].
      O'zingizni shubha bilan qaraydigan investor o'rniga qo'ying. Bu g'oya barbod bo'lishi mumkin bo'lgan uchta eng kuchli sababni jiddiylik darajasi bo'yicha tartiblab bering.
      Keyin har biri bo'yicha qanday dalil fikringizni o'zgartirishini ayting.
    why: "Modeldan muammo topish so'ralgan va u qaysi javob sizga yoqishini bilmaydi."
    check:
      q: "Qaysi savolga halolroq javob olasiz?"
      options:
        - "\"Bu rejaning eng zaif joylari qaysi?\""
        - "\"Bu reja puxta, to'g'rimi?\""
      answer: 0
      explain: "Javobga yetaklovchi savollar ma'qullash olib keladi. Betaraf yoki tanqidiy savollar esa ma'lumot beradi."
    keep: |-
      Mana [g'oya / reja / qoralama]: [shu yerga qo'ying]
      Eng kuchli uchta e'tirozni ayting, eng jiddiysidan boshlang.
      Ularni yumshatmang. Keyin har birini qanday tuzatish mumkinligini taklif qiling.

  - id: verify-answers
    module: thinking
    title: "Javobga ishonishdan oldin tekshiring"
    idea: "Model noto'g'ri faktni to'liq ishonch bilan aytishi mumkin. Unga \"bilmayman\" deyishga ruxsat bering, har bir da'vo qayerdan olinganini so'rang va muhim narsalarni o'zingiz tekshiring: birinchi navbatda raqamlar, sanalar, iqtiboslar va manbalarni."
    weak: "O'zbekistonda internetdan foydalanish haqida beshta statistik ma'lumotni manbalari bilan ber."
    better: |-
      Faqat quyida keltirilgan hisobotga tayanib, internetdan foydalanishga oid statistik ma'lumotlarni sanab bering.
      Har biri uchun u olingan gapni aynan o'zidek keltiring.
      Agar hisobotda biror narsa bo'lmasa, taxmin qilmasdan "hisobotda yo'q" deb yozing.

      <report>
      [hisobotni shu yerga qo'ying]
      </report>
    why: "Model siz bergan material asosida ishlaydi, dalilini ko'rsatadi va bo'shliqni tan olishning xavfsiz yo'liga ega."
    check:
      q: "Model sizga ilmiy maqolaga havola berdi. Nima qilish kerak?"
      options:
        - "Ishlatavering. Havolalar har doim haqiqiy bo'ladi."
        - "Iqtibos keltirishdan oldin maqolani o'zingiz topib ko'ring."
      answer: 1
      explain: "To'qib chiqarilgan manbalar — hammaga ma'lum nuqson. Ularni har doim tekshiring."
    keep: |-
      Faqat quyidagi materialga tayanib javob bering.
      Har bir da'voni tasdiqlaydigan gapni iqtibos qilib keltiring.
      Agar javob materialda bo'lmasa, shuni ayting. Taxmin qilmang.

      <material>
      [shu yerga qo'ying]
      </material>

  - id: long-documents
    module: thinking
    title: "Uzun hujjatlar bilan ishlash"
    idea: "Material uzun bo'lsa, avval hujjatni, oxirida esa savolingizni qo'ying. Hujjatlar bir nechta bo'lsa, har birini nomi ko'rsatilgan alohida tegga o'rang. Avval tegishli iqtiboslarni so'rasangiz, javob matndan uzoqlashib ketmaydi."
    weak: "Asosiy xavflar qaysi? [avval savol, undan keyin yigirma sahifa matn qo'yilgan]"
    better: |-
      <document name="project_plan">
      [1-hujjatni shu yerga qo'ying]
      </document>
      <document name="budget">
      [2-hujjatni shu yerga qo'ying]
      </document>

      Avval ikkala hujjatdan xavflar tilga olingan parchalarni iqtibos qilib keltiring.
      Keyin faqat shu iqtiboslarga tayanib, uchta asosiy xavfni va har biri qaysi hujjatdan olinganini sanab bering.
    why: "Savol javobdan bevosita oldin turadi, iqtiboslar esa modelni matndan chetga chiqib ketishdan saqlaydi."
    check:
      q: "Uzun hujjat promptning qayerida turishi kerak?"
      options:
        - "Boshida, savol esa undan keyin."
        - "Eng oxirida, barcha ko'rsatmalardan keyin."
      answer: 0
      explain: "Avval material, oxirida savol — uzun matnlarda shu tartib yaxshiroq javob beradi."
    keep: |-
      <document name="[nom]">
      [shu yerga qo'ying]
      </document>

      Avval mana bu savolga tegishli qismlarni iqtibos qilib keltiring: [savol].
      Keyin faqat shu iqtiboslarga tayanib javob bering.

  - id: iterate
    module: thinking
    title: "Birinchi promptni qoralama deb biling"
    idea: "Yaxshi promptlar kamdan-kam hollarda bir urinishda yoziladi. Javobni o'qing, nimasi noto'g'ri ekanini ayting va nimani o'zgartirish kerakligini ko'rsating. Shuningdek, modeldan promptingizni yaxshilashni yoki ishni boshlashdan oldin sizga savollar berishni so'rashingiz mumkin."
    weak: "Yo'q, yomon chiqdi. Qaytadan urinib ko'r."
    better: |-
      Deyarli o'xshadi. Tuzilishini saqlang, lekin:
      1. Kirish qismini ikki barobar qisqartiring.
      2. Ikkinchi misolni futbol haqidagi misolga almashtiring.
      3. Soddaroq so'zlar ishlating: men buni 14 yoshli bolaga tushuntiryapman.
    why: "Aniq fikr-mulohaza modelga qaysi qismlarni saqlab, qaysilarini o'zgartirish kerakligini bildiradi."
    check:
      q: "Javob 70% to'g'ri. Eng tez yo'l qaysi?"
      options:
        - "Yangi chat ochib, yaxshiroq natija chiqishiga umid qilish."
        - "Nimani saqlash va nimani o'zgartirish kerakligini aniq aytish."
      answer: 1
      explain: "Aniq yo'naltirilgan tuzatishlar noldan boshlashga qaraganda tezroq natijaga olib keladi."
    keep: |-
      Boshlashdan oldin tushunarsiz joylar bo'yicha menga beshtagacha savol bering.
      ---
      [Yaxshi chiqqan qism]ni saqlang. [Tuzatilishi kerak bo'lgan narsa]ni o'zgartiring, chunki [sabab].

  - id: brief-an-agent
    module: agents
    title: "Ishni agentga topshirish"
    idea: "Agent (Claude Code, ChatGPT'ning agent rejimi va shunga o'xshash vositalar) sizning ishtirokingizsiz ko'p qadam bajaradi. Unga savol emas, to'liq topshiriq kerak: maqsad, \"tayyor\" degani nimani anglatishi, nimaga tegmasligi kerakligi hamda qachon to'xtab, sizdan so'rashi lozimligi."
    weak: "Saytimni yaxshiroq qil."
    better: |-
      Maqsad: shu papkadagi shaxsiy saytimga tungi rejimni yoqib-o'chiradigan tugma qo'shish.
      Tayyor degani: sarlavha qismidagi tugma mavzuni almashtiradi, tanlov sahifa qayta yuklangandan keyin ham saqlanib qoladi va ikkala mavzuda ham matn bemalol o'qiladi.
      Cheklovlar: faqat oddiy CSS va JavaScript, yangi kutubxonalarsiz. Sahifa kontentini o'zgartirmang.
      Tahrirlashdan oldin rejangizni bir necha qatorda ayting. Biror narsa tushunarsiz bo'lsa, taxmin qilmasdan so'rang.
      Tugatgach, qaysi fayllarni o'zgartirganingizni va qanday sinab ko'rganingizni sanab bering.
    why: "Agent maqsadni, chegaralarni va ishi qanday baholanishini biladi, shuning uchun yo'ldan adashmasdan mustaqil ishlay oladi."
    check:
      q: "Agentga beriladigan topshiriqning qaysi qismi eng ko'p unutiladi?"
      options:
        - "\"Tayyor\" degani nima ekanining aniq ta'rifi."
        - "Salomlashish."
      answer: 0
      explain: "Marra belgilanmasa, agent yo juda erta to'xtaydi, yo to'xtamasdan o'zgartirishda davom etaveradi."
    keep: |-
      Maqsad: [nimaga erishish kerak va nima uchun]
      Tayyor degani: [ish to'g'ri bajarilganini isbotlaydigan tekshiruvlar]
      Cheklovlar: [tegish mumkin bo'lmagan vositalar, fayllar yoki amallar]
      Bundan oldin mendan so'rang: [xavfli yoki ortga qaytarib bo'lmaydigan qadamlar]
      Hisobot: [oxirida menga nimalarni aytish kerak]

  - id: prompts-for-code
    module: agents
    title: "Kod uchun promptlar"
    idea: "Kod haqida so'raganda yaxshi xato hisoboti (bug report) beradigan ma'lumotlarni bering: nimani kutgansiz, nima sodir bo'ldi, xatoning aniq matni va uni qanday takrorlash mumkin. Tuzatishdan oldin sababini so'rang, shuningdek, faqat testdan o'tkazib yuboradigan emas, umumiy yechimni talab qiling."
    weak: "Kodim ishlamayapti. Tuzatib ber."
    better: |-
      Bu Python funksiyasi ro'yxatning o'rtacha qiymatini qaytarishi kerak, lekin bo'sh ro'yxatda xato berib to'xtab qolyapti.

      Kutilgan: average([]) 0 qaytaradi.
      Amalda: ZeroDivisionError: division by zero.

      <code>
      def average(nums):
          return sum(nums) / len(nums)
      </code>

      Avval sababini bir-ikki gapda tushuntiring. Keyin eng kichik tuzatishni va bo'sh ro'yxat holati uchun test bering.
      Ishlab turgan kodni qayta yozmang.
    why: "Kutilgan va amaldagi natija to'g'ridan-to'g'ri xatoga ishora qiladi, \"eng kichik tuzatish\" degan talab esa keraksiz qayta yozishning oldini oladi."
    check:
      q: "Xatoni qidirish uchun yozilgan promptda har doim nima bo'lishi kerak?"
      options:
        - "Xato xabarining aniq matni va uning o'rniga nimani kutganingiz."
        - "Xatoni tuzatish shoshilinch ekani haqidagi eslatma."
      answer: 0
      explain: "Xato matni va kutilgan natija — eng foydali ikkita ma'lumot."
    keep: |-
      Til va versiya: [masalan, Python 3.12]
      Kutilgan: [nima bo'lishi kerak]
      Amalda: [nima bo'lyapti, xatoning aniq matni bilan]
      Takrorlash qadamlari: [qanday qilib]

      <code>
      [kodning tegishli qismini shu yerga qo'ying]
      </code>

      Avval sababini tushuntiring, keyin eng kichik tuzatishni va test bering.

  - id: custom-instructions
    module: agents
    title: "Sizni eslab qoladigan qilib sozlang"
    idea: "Agar har bir chatda o'zingiz haqingizdagi bir xil ma'lumotni takrorlayotgan bo'lsangiz, uni bir marta saqlab qo'ying. ChatGPT'da maxsus ko'rsatmalar (custom instructions) va xotira bor; Claude'da esa loyihalar, uslublar va profil sozlamalari. Ikkita qisqa eslatma yozing: kimsiz va javoblar qanday bo'lishini yoqtirasiz."
    weak: "(Har bir yangi chatda \"Men kompyuter fanlari yo'nalishining 2-kurs talabasiman, sodda javob ber\" deb yozish.)"
    better: |-
      Men haqimda: Toshkentda kompyuter fanlari yo'nalishining 2-kurs talabasiman. Python'ni yaxshi bilaman, C++ va algoritmlarni o'rganyapman. Ingliz, o'zbek va rus tillarida o'qiy olaman.

      Qanday javob berish kerak: to'g'ridan-to'g'ri javobdan boshlang. Qisqa xatboshilar bilan yozing. Kodni nazariyadan oldin ko'rsating. Xato qilsam, buni ochiq ayting. Biror faktga ishonchingiz komil bo'lmasa, shuni ayting.
    why: "Har bir yangi chat sizning kontekstingiz bilan boshlanadi, shuning uchun qisqa promptlarga ham shaxsan sizga mos javob keladi."
    check:
      q: "Saqlangan ko'rsatmalarga nima yoziladi?"
      options:
        - "O'zingiz haqingizdagi o'zgarmas ma'lumotlar va sizga ma'qul javob uslubi."
        - "Bugungi uy vazifasining to'liq matni."
      answer: 0
      explain: "Oylar davomida o'zgarmaydigan narsani saqlang. Vazifa tafsilotlarini esa chatning o'ziga yozing."
    keep: |-
      Men haqimda: [rol, daraja, soha, tillar]
      Maqsadlarim: [nimaga intilyapsiz]
      Qanday javob berish kerak: [hajm, ohang, format, ishonch komil bo'lmaganda nima qilish kerak]

  - id: chain-prompts
    module: advanced
    title: "Katta ishni zanjirga bo'ling"
    idea: "Katta ish uchun yozilgan bitta ulkan prompt har bir bosqichda o'rtacha natija beradi. Ishni qadamlarga bo'ling: har bir qadamda bitta vazifa bo'lsin va uning natijasi keyingi qadamga kirish bo'lib xizmat qilsin. Qadamlar orasida natijani ko'rib chiqib, tuzatishingiz mumkin, shunda boshdagi xato keyingi hamma narsani buzmaydi."
    weak: "O'zbekistondagi elektromobillarni o'rganib chiq va menga xulosalari bilan to'liq hisobot yozib ber."
    better: |-
      Bu ishni to'rt qadamda bajaramiz. Hozir faqat 1-qadamni bajaring va javobimni kuting.

      1-qadam: O'zbekistondagi elektromobillar haqidagi yaxshi hisobot javob berishi shart bo'lgan o'nta savolni sanab bering.
      2-qadam: men ma'qullagan har bir savol bo'yicha faktlarni manbalari bilan to'plang.
      3-qadam: shu faktlar asosida reja tuzing.
      4-qadam: reja bo'yicha hisobotni yozing.
    why: "Har bir qadam yaxshi bajarish uchun yetarlicha kichik, keyingisiga kuch sarflanishidan oldin esa yo'nalishni siz ma'qullaysiz."
    check:
      q: "Zanjirning bitta uzun promptdan asosiy afzalligi nimada?"
      options:
        - "Har bir bosqichni keyingisi unga tayanmasidan oldin tekshirib, tuzatish mumkin."
        - "Unda har doim kamroq so'z ishlatiladi."
      answer: 0
      explain: "Zanjir sizga nazorat nuqtalarini beradi. Xatolar paydo bo'lgan joyidayoq ushlanadi."
    keep: |-
      Bu ishni qadamma-qadam bajaramiz. Hozir faqat 1-qadamni bajaring, keyin to'xtab, kuting.

      1-qadam: [birinchi kichik vazifa]
      2-qadam: [1-qadam natijasidan foydalanadi]
      3-qadam: [2-qadam natijasidan foydalanadi]

      Har bir qadamdan keyin natijani ko'rsating va davom etish-etmaslikni so'rang.

  - id: spec-first
    module: advanced
    title: "Koddan oldin spetsifikatsiya yozing"
    idea: "Bir qatorli g'oyadan kod yozishni boshlagan agent har bir bo'shliqni o'z taxminlari bilan to'ldiradi. Avval u sizdan savol-javob qilib olsin va qisqa spetsifikatsiya yozsin: dastur nima qiladi, nima qilmaydi va ishlayotganini qanday bilasiz. Spetsifikatsiyani o'qib, tuzating. Shundan keyingina qurishga ruxsat bering."
    weak: "Menga vazifalar ro'yxati (to-do) ilovasini yasab ber."
    better: |-
      Menga vazifalar ro'yxati (to-do) ilovasi kerak. Hozircha kod yozmang.
      Avval foydalanuvchilar, funksiyalar va nimalar doiradan tashqarida ekanini tushunib olguningizcha menga bittadan savol bering.
      Keyin bir sahifali spetsifikatsiya yozing: maqsad, funksiyalar, nimalar kirmaydi, qanday ma'lumot saqlanadi va ilova ishlayotganini isbotlaydigan beshta tekshiruv.
      Kod yozishdan oldin spetsifikatsiyani ma'qullashimni kuting.
    why: "Spetsifikatsiyadagi bitta gapni tuzatish bir necha soniya oladi. Xuddi shu anglashilmovchilikni tayyor kodda tuzatish esa soatlab vaqt oladi."
    check:
      q: "Anglashilmovchilikni tuzatishning eng arzon payti qachon?"
      options:
        - "Kod tayyor bo'lgandan keyin."
        - "Spetsifikatsiyada, hali hech qanday kod yozilmasidan oldin."
      answer: 1
      explain: "Avval rejani so'z bilan kelishib oling. Kodni qayta yozish qimmatga tushadi."
    keep: |-
      Men [g'oya]ni yasamoqchiman. Hozircha kod yozmang.
      1. Talablar aniq bo'lguncha menga bittadan savol bering.
      2. Qisqa spetsifikatsiya yozing: maqsad, funksiyalar, doiradan tashqaridagi narsalar, ishlayotganini isbotlaydigan tekshiruvlar.
      3. Ma'qullashimni kuting.
      4. Keyin uni qadam-baqadam amalga oshiring va har bir qadamni spetsifikatsiya bilan solishtirib tekshiring.

  - id: keep-state
    module: advanced
    title: "Uzoq davom etadigan ishda holatni saqlang"
    idea: "Uzoq davom etadigan ish bitta sessiyaga sig'maydi, yangi sessiya esa hech narsani eslamaydi. Agent o'z xotirasini fayllarda saqlasin: nima bajarilgani va navbatda nima turgani yozilgan qaydlar, vazifalar ro'yxati hamda nima ishlayotganini ko'rsatadigan testlar. Yangi sessiya shularni o'qishdan boshlanadi."
    weak: "Kechagi ishimizni davom ettir."
    better: |-
